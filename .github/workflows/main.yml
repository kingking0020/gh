name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      RDP_USERNAME: runneradmin
      RDP_PASSWORD: WindowsRDP#2025
      CLICK_X: "84"
      CLICK_Y: "614"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # BASIC ENVIRONMENT INFO
      # ============================================================

      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "=== RUNNER INFORMATION ==="

          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable

      # ============================================================
      # RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "=== Configuring RDP ==="

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          $securePassword =
            ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          # --------------------------------------------------------
          # Create or update user
          # --------------------------------------------------------

          $existingUser =
            Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "User exists. Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires $true

          }
          else {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Actions RDP account"

          }

          # --------------------------------------------------------
          # Groups
          # --------------------------------------------------------

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Enable RDP
          # --------------------------------------------------------

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          # --------------------------------------------------------
          # Firewall
          # --------------------------------------------------------

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # Service
          # --------------------------------------------------------

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "=== RDP SERVICE ==="

          Get-Service TermService |
            Format-Table Name, Status, StartType -AutoSize

          Write-Host ""
          Write-Host "RDP configured successfully."

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Installing Tailscale ==="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is empty."
          }

          $tailscaleExe =
            "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {

              $installer =
                "$env:TEMP\tailscale-setup.exe"

              Write-Host "Downloading Tailscale..."

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                -OutFile $installer

              Write-Host "Installing Tailscale..."

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/quiet" `
                -Wait

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable was not found."
          }

          Write-Host "Starting Tailscale..."

          & $tailscaleExe up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp-3" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=== TAILSCALE STATUS ==="

          & $tailscaleExe status

          Write-Host ""
          Write-Host "=== TAILSCALE IPv4 ==="

          $tailscaleIP =
            (& $tailscaleExe ip -4 |
              Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
              throw "Could not obtain Tailscale IPv4 address."
          }

          Write-Host $tailscaleIP

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME
      # ============================================================

      - name: Check and install Chrome
        shell: powershell
        run: |
          Write-Host "=== Checking Chrome ==="

          $paths = @(
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromePath = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {

                  $chromePath = $path
                  break

              }
          }

          if (-not $chromePath) {

              Write-Host "Chrome not found."
              Write-Host "Installing with Chocolatey..."

              choco install googlechrome -y --no-progress

              Start-Sleep -Seconds 5

              foreach ($path in $paths) {

                  if (Test-Path $path) {

                      $chromePath = $path
                      break

                  }
              }
          }

          if (-not $chromePath) {
              throw "Chrome executable was not found."
          }

          Write-Host "Chrome found:"
          Write-Host $chromePath

          "CHROME_PATH=$chromePath" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME POLICY
      # ============================================================

      - name: Configure Chrome policies
        shell: powershell
        run: |
          Write-Host "=== Configuring Chrome policies ==="

          $policyPath =
            "HKLM:\Software\Policies\Google\Chrome"

          if (-not (Test-Path $policyPath)) {

              New-Item `
                -Path $policyPath `
                -Force |
                Out-Null
          }

          # Disable browser sign-in UI
          New-ItemProperty `
            -Path $policyPath `
            -Name "BrowserSignin" `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          # Disable sync
          New-ItemProperty `
            -Path $policyPath `
            -Name "SyncDisabled" `
            -PropertyType DWord `
            -Value 1 `
            -Force |
            Out-Null

          Write-Host ""
          Write-Host "=== Applied Chrome Policies ==="

          Get-ItemProperty `
            -Path $policyPath |
            Select-Object BrowserSignin, SyncDisabled |
            Format-List

      # ============================================================
      # CHROME PROFILE
      # ============================================================

      - name: Prepare Chrome profile
        shell: powershell
        run: |
          Write-Host "=== Preparing Chrome profile ==="

          $chromeProfile =
            "C:\temp\ChromeProfile"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          Remove-Item `
            $chromeProfile `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $chromeProfile `
            -Force |
            Out-Null

          # Stop any old Chrome processes
          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Write-Host "Chrome profile ready."

      # ============================================================
      # RDP INFO
      # ============================================================

      - name: Show RDP connection information
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RDP INFORMATION"
          Write-Host "=========================================="

          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "RDP Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "RDP Port:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "Connect externally using:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host "=========================================="

      # ============================================================
      # DO NOT CREATE A LOCAL MSTSC SESSION
      # ============================================================
      #
      # IMPORTANT:
      # We intentionally do NOT run mstsc.exe here.
      #
      # The GitHub runner already has an interactive Windows desktop.
      # Opening a second RDP session from inside the runner can switch
      # sessions/desktops and cause gdigrab/screenshot problems.
      #
      # External RDP users can connect through Tailscale while the
      # workflow remains active.

      - name: Verify interactive desktop
        shell: powershell
        run: |
          Write-Host "=== Verifying Windows desktop ==="

          Write-Host "USERNAME:"
          $env:USERNAME

          Write-Host ""
          Write-Host "SESSIONNAME:"
          $env:SESSIONNAME

          Write-Host ""
          Write-Host "SESSION ID:"

          try {
              $sessionOutput =
                (qwinsta |
                  Out-String)

              Write-Host $sessionOutput
          }
          catch {
              Write-Host "qwinsta failed: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "Primary screen:"

          Add-Type -AssemblyName System.Windows.Forms

          $screen =
            [System.Windows.Forms.Screen]::PrimaryScreen

          if ($null -eq $screen) {
              throw "Primary screen is null."
          }

          Write-Host "X=$($screen.Bounds.X)"
          Write-Host "Y=$($screen.Bounds.Y)"
          Write-Host "Width=$($screen.Bounds.Width)"
          Write-Host "Height=$($screen.Bounds.Height)"

      # ============================================================
      # START CHROME DIRECTLY
      # ============================================================

      - name: Start Chrome
        shell: powershell
        run: |
          Write-Host "=== Starting Chrome directly ==="

          $chromePath = $env:CHROME_PATH

          if (-not $chromePath) {
              throw "CHROME_PATH is empty."
          }

          if (-not (Test-Path $chromePath)) {
              throw "Chrome executable does not exist: $chromePath"
          }

          $chromeProfile =
            "C:\temp\ChromeProfile"

          $arguments = @(
            "--no-first-run"
            "--no-default-browser-check"
            "--disable-session-crashed-bubble"
            "--start-maximized"
            "--new-window"
            "--user-data-dir=$chromeProfile"
            "https://agentchain.noesisai.it/faucet?utm_source=chatgpt.com"
          )

          Write-Host "Chrome arguments:"
          $arguments | ForEach-Object {
              Write-Host $_
          }

          $chromeProcess =
            Start-Process `
              -FilePath $chromePath `
              -ArgumentList $arguments `
              -PassThru

          if ($null -eq $chromeProcess) {
              throw "Chrome failed to start."
          }

          Write-Host "Chrome PID: $($chromeProcess.Id)"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=== Chrome Processes ==="

          $chromeProcesses =
            Get-Process chrome `
              -ErrorAction SilentlyContinue

          if (-not $chromeProcesses) {
              throw "Chrome process was not found after startup."
          }

          $chromeProcesses |
            Select-Object `
              Id,
              MainWindowHandle,
              MainWindowTitle,
              Responding |
            Format-Table -AutoSize

      # ============================================================
      # INSTALL FFMPEG
      # ============================================================

      - name: Install FFmpeg
        shell: powershell
        run: |
          Write-Host "=== Checking FFmpeg ==="

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {

              Write-Host "FFmpeg not found."
              Write-Host "Installing..."

              choco install ffmpeg -y --no-progress

              Start-Sleep -Seconds 5
          }

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {
              throw "FFmpeg was not found after installation."
          }

          Write-Host ""
          Write-Host "FFmpeg:"
          Write-Host $ffmpeg.Source

          ffmpeg -version |
            Select-Object -First 3

          $ffprobe =
            Get-Command ffprobe.exe `
              -ErrorAction SilentlyContinue

          if ($ffprobe) {
              Write-Host ""
              Write-Host "FFprobe:"
              Write-Host $ffprobe.Source
          }

      # ============================================================
      # PREPARE RECORDER
      # ============================================================

      - name: Prepare recording files
        shell: powershell
        run: |
          Write-Host "=== Preparing recording ==="

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          $requiredScript =
            "scripts\record.ps1"

          if (-not (Test-Path $requiredScript)) {
              throw "$requiredScript was not found."
          }

          Copy-Item `
            $requiredScript `
            "C:\temp\RDPClickAndRecord.ps1" `
            -Force

          # Validate syntax before execution
          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              "C:\temp\RDPClickAndRecord.ps1",
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {

              Write-Host "=== POWERSHELL PARSE ERRORS ==="

              foreach ($errorItem in $errors) {
                  Write-Host $errorItem.ToString()
              }

              throw "Recording script contains PowerShell syntax errors."
          }

          Write-Host "Recording script syntax: OK"

      # ============================================================
      # START RECORDING DIRECTLY
      # ============================================================

      - name: Run recording script
        shell: powershell
        env:
          CLICK_X: "84"
          CLICK_Y: "614"
        run: |
          Write-Host "=========================================="
          Write-Host "STARTING CLICK RECORDING"
          Write-Host "=========================================="

          $scriptPath =
            "C:\temp\RDPClickAndRecord.ps1"

          if (-not (Test-Path $scriptPath)) {
              throw "Recording script not found."
          }

          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File $scriptPath

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Recording script exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "Recording script failed with exit code $exitCode."
          }

      # ============================================================
      # DEBUG
      # ============================================================

      - name: Debug recording outputs
        if: always()
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "DEBUG OUTPUTS"
          Write-Host "=========================================="

          $files = @(
              "C:\temp\rdp-click-screenshot.png",
              "C:\temp\rdp-click-video.mp4",
              "C:\temp\click-record.log",
              "C:\temp\ffmpeg-output.log",
              "C:\temp\ffmpeg-error.log",
              "C:\temp\RDPClickAndRecord.ps1"
          )

          foreach ($path in $files) {

              if (Test-Path $path) {

                  $item =
                    Get-Item $path

                  Write-Host ""
                  Write-Host "FOUND:"
                  Write-Host $path
                  Write-Host "Size: $($item.Length) bytes"

              }
              else {

                  Write-Host ""
                  Write-Host "NOT FOUND:"
                  Write-Host $path

              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TEMP DIRECTORY"
          Write-Host "=========================================="

          Get-ChildItem `
            "C:\temp" `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Sort-Object LastWriteTime -Descending |
            Format-Table -AutoSize

          if (Test-Path "C:\temp\click-record.log") {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "click-record.log"
              Write-Host "=========================================="

              Get-Content `
                "C:\temp\click-record.log"
          }

          if (Test-Path "C:\temp\ffmpeg-error.log") {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "ffmpeg-error.log"
              Write-Host "=========================================="

              Get-Content `
                "C:\temp\ffmpeg-error.log"
          }

      # ============================================================
      # UPLOAD EVERYTHING
      # ============================================================

      - name: Upload all RDP recording outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rdp-record-output
          path: |
            C:\temp\rdp-click-screenshot.png
            C:\temp\rdp-click-video.mp4
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
            C:\temp\RDPClickAndRecord.ps1
          if-no-files-found: warn
          retention-days: 7
