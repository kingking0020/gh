name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Configuring RDP ==="

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $username = "runneradmin"
          $password = "WindowsRDP#2025"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            Write-Host "Creating $username"

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "Runner Administrator" `
              -Description "GitHub Actions RDP User"

          }
          else {

            Write-Host "$username already exists"

            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }

          $member = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\$username$"
            }

          if (-not $member) {

            Write-Host "Adding user to Administrators"

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username
          }
          else {

            Write-Host "$username is already Administrator"
          }

          Write-Host "RDP configuration complete"


      # ============================================================
      # 2. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing Tailscale ==="

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found"
          }

          Write-Host "Starting Tailscale..."

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp"

          Start-Sleep -Seconds 10

          Write-Host "=== Tailscale status ==="

          & $tailscale status

          Write-Host "=== Tailscale IP ==="

          & $tailscale ip -4


      # ============================================================
      # 3. INSTALL CHROME
      # ============================================================
      - name: Install Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Checking Chrome ==="

          $chromePaths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chrome) {

            Write-Host "Chrome not found. Installing..."

            $installer = "$env:TEMP\chrome.msi"

            Invoke-WebRequest `
              -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/silent","/install" `
              -Wait

            Start-Sleep -Seconds 5

            $chrome = $chromePaths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $chrome) {
            throw "Chrome installation failed"
          }

          Write-Host "Chrome:"
          Write-Host $chrome


      # ============================================================
      # 4. CREATE CHROME AUTO-START SCRIPT
      # ============================================================
      - name: Create Chrome startup task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force | Out-Null

          $chromeScript = @'
          $ErrorActionPreference = "Continue"

          $chromePaths = @(
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if (-not $chrome) {
              exit 1
          }

          Get-Process chrome -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Start-Process `
              -FilePath $chrome `
              -ArgumentList @(
                  "--no-first-run",
                  "--no-default-browser-check",
                  "--disable-features=WelcomeToChrome",
                  "--start-maximized",
                  "https://github.com"
              )
          '@

          Set-Content `
            -Path "C:\temp\OpenChrome.ps1" `
            -Value $chromeScript `
            -Encoding UTF8

          schtasks /delete `
            /tn "OpenChromeAutomatically" `
            /f 2>$null

          schtasks /create `
            /tn "OpenChromeAutomatically" `
            /tr 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\temp\OpenChrome.ps1' `
            /sc ONLOGON `
            /ru runneradmin `
            /rp "WindowsRDP#2025" `
            /it `
            /f

          Write-Host "Chrome task created"


      # ============================================================
      # 5. CONNECT TO LOCAL RDP
      # ============================================================
      - name: Start RDP session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Creating RDP credentials ==="

          cmdkey `
            /generic:TERMSRV/127.0.0.1 `
            /user:runneradmin `
            /pass:"WindowsRDP#2025"

          cmdkey `
            /generic:TERMSRV/localhost `
            /user:runneradmin `
            /pass:"WindowsRDP#2025"

          Write-Host "Starting mstsc..."

          Start-Process `
            "mstsc.exe" `
            -ArgumentList "/v:127.0.0.1 /f"

          Write-Host "Waiting 100 seconds for RDP..."

          Start-Sleep -Seconds 100

          Write-Host "=== QUSER ==="

          quser

          Write-Host "RDP session started"


      # ============================================================
      # 6. START CHROME
      # ============================================================
      - name: Start Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting Chrome scheduled task..."

          schtasks /run /tn "OpenChromeAutomatically"

          Start-Sleep -Seconds 10

          Write-Host "=== Chrome processes ==="

          Get-Process chrome -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,MainWindowTitle |
            Format-Table -AutoSize

          Write-Host "Waiting 100 seconds for website..."

          Start-Sleep -Seconds 100


      # ============================================================
      # 7. INSTALL FFMPEG
      # ============================================================
      - name: Install FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing FFmpeg ==="

          choco install ffmpeg `
            -y `
            --no-progress

          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {
            throw "FFmpeg command not found"
          }

          Write-Host "=== FFmpeg version ==="

          ffmpeg -version


      # ============================================================
      # 8. CREATE RECORDING SCRIPT
      # ============================================================
      - name: Create recording script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force | Out-Null

          $script = @'
          $ErrorActionPreference = "Continue"

          $log = "C:\temp\click-record.log"

          function Log($msg) {
              $line = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')  $msg"
              Add-Content -Path $log -Value $line
              Write-Host $line
          }

          try {

              Log "===== RECORDING START ====="

              # --------------------------------------------------------
              # C# Windows API
              # --------------------------------------------------------

              Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public static class WindowAPI
          {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(
                  EnumWindowsProc lpEnumFunc,
                  IntPtr lParam
              );

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(
                  IntPtr hWnd
              );

              [DllImport("user32.dll")]
              public static extern int GetWindowText(
                  IntPtr hWnd,
                  StringBuilder text,
                  int count
              );

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(
                  IntPtr hWnd,
                  out uint processId
              );

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(
                  IntPtr hWnd
              );

              public const int SW_MINIMIZE = 6;
          }
          "@@

              # --------------------------------------------------------
              # Find Chrome PID
              # --------------------------------------------------------

              $chromeProcesses = @(
                  Get-Process chrome -ErrorAction SilentlyContinue
              )

              if ($chromeProcesses.Count -eq 0) {
                  Log "ERROR: Chrome is not running"
                  exit 10
              }

              $chromePids = @{}

              foreach ($p in $chromeProcesses) {
                  $chromePids[[uint32]$p.Id] = $true
                  Log "Chrome PID: $($p.Id)"
              }

              # --------------------------------------------------------
              # Minimize every visible top-level application window
              # except Chrome
              # --------------------------------------------------------

              Log "Minimizing other application windows..."

              [WindowAPI]::EnumWindows(
                  {
                      param($hWnd, $lParam)

                      try {

                          if (-not [WindowAPI]::IsWindowVisible($hWnd)) {
                              return $true
                          }

                          $pid = [uint32]0

                          [WindowAPI]::GetWindowThreadProcessId(
                              $hWnd,
                              [ref]$pid
                          ) | Out-Null

                          if ($chromePids.ContainsKey($pid)) {
                              return $true
                          }

                          $sb = New-Object System.Text.StringBuilder 512

                          [WindowAPI]::GetWindowText(
                              $hWnd,
                              $sb,
                              $sb.Capacity
                          ) | Out-Null

                          $title = $sb.ToString()

                          if ([string]::IsNullOrWhiteSpace($title)) {
                              return $true
                          }

                          Log "Minimize: $title (PID $pid)"

                          [WindowAPI]::ShowWindow(
                              $hWnd,
                              [WindowAPI]::SW_MINIMIZE
                          ) | Out-Null

                      }
                      catch {
                          Log "Window minimize error: $($_.Exception.Message)"
                      }

                      return $true

                  },
                  [IntPtr]::Zero
              ) | Out-Null

              Start-Sleep -Milliseconds 1000

              # --------------------------------------------------------
              # Bring Chrome to foreground
              # --------------------------------------------------------

              $chromeWindow = $null

              foreach ($p in $chromeProcesses) {

                  if ($p.MainWindowHandle -ne 0) {

                      $chromeWindow = $p.MainWindowHandle
                      Log "Chrome window found: $chromeWindow"
                      break
                  }
              }

              if ($chromeWindow) {

                  [WindowAPI]::ShowWindow(
                      $chromeWindow,
                      3
                  ) | Out-Null

                  [WindowAPI]::SetForegroundWindow(
                      $chromeWindow
                  ) | Out-Null

                  Log "Chrome brought to foreground"

              }
              else {

                  Log "WARNING: Chrome main window not found"
              }

              # --------------------------------------------------------
              # Red dot
              # --------------------------------------------------------

              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing

              $form = New-Object System.Windows.Forms.Form

              $form.FormBorderStyle = [System.Windows.Forms.FormBorderStyle]::None
              $form.StartPosition = [System.Windows.Forms.FormStartPosition]::Manual
              $form.Location = New-Object System.Drawing.Point(79,609)
              $form.Size = New-Object System.Drawing.Size(10,10)
              $form.BackColor = [System.Drawing.Color]::Red
              $form.TopMost = $true
              $form.ShowInTaskbar = $false

              # Don't steal focus from Chrome
              $form.Add_Shown({
                  $form.Activate() | Out-Null
              })

              Log "Showing red dot at approximately 84,614"

              $form.Show()

              $form.Refresh()

              Start-Sleep -Milliseconds 1000

              # --------------------------------------------------------
              # FFmpeg paths
              # --------------------------------------------------------

              $video = "C:\temp\rdp-click-video.mp4"
              $screenshot = "C:\temp\rdp-click-screenshot.png"
              $ffmpegOut = "C:\temp\ffmpeg-output.log"
              $ffmpegErr = "C:\temp\ffmpeg-error.log"

              Remove-Item `
                  $video,
                  $screenshot,
                  $ffmpegOut,
                  $ffmpegErr `
                  -Force `
                  -ErrorAction SilentlyContinue

              # --------------------------------------------------------
              # Start FFmpeg
              # --------------------------------------------------------

              Log "Starting FFmpeg desktop capture..."

              $ffmpegArgs = @(
                  "-y",
                  "-f", "gdigrab",
                  "-framerate", "10",
                  "-draw_mouse", "1",
                  "-i", "desktop",
                  "-t", "15",
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-pix_fmt", "yuv420p",
                  "-movflags", "+faststart",
                  $video
              )

              Log "FFmpeg arguments: $($ffmpegArgs -join ' ')"

              $psi = New-Object System.Diagnostics.ProcessStartInfo

              $psi.FileName = "ffmpeg.exe"
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true

              foreach ($arg in $ffmpegArgs) {
                  [void]$psi.ArgumentList.Add($arg)
              }

              $ffmpeg = New-Object System.Diagnostics.Process

              $ffmpeg.StartInfo = $psi

              $null = $ffmpeg.Start()

              Log "FFmpeg PID: $($ffmpeg.Id)"

              # --------------------------------------------------------
              # 5 seconds before click
              # --------------------------------------------------------

              Log "Waiting 5 seconds before click..."

              Start-Sleep -Seconds 5

              # --------------------------------------------------------
              # Click 84,614
              # --------------------------------------------------------

              Log "CLICKING X=84 Y=614"

              Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class MouseAPI
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(
                  int X,
                  int Y
              );

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint dwFlags,
                  uint dx,
                  uint dy,
                  uint dwData,
                  UIntPtr dwExtraInfo
              );

              public const uint MOUSEEVENTF_LEFTDOWN = 0x0002;
              public const uint MOUSEEVENTF_LEFTUP = 0x0004;
          }
          "@@

              [MouseAPI]::SetCursorPos(84,614) | Out-Null

              Start-Sleep -Milliseconds 200

              [MouseAPI]::mouse_event(
                  [MouseAPI]::MOUSEEVENTF_LEFTDOWN,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Start-Sleep -Milliseconds 100

              [MouseAPI]::mouse_event(
                  [MouseAPI]::MOUSEEVENTF_LEFTUP,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Log "Click completed"

              # --------------------------------------------------------
              # Screenshot
              # --------------------------------------------------------

              Start-Sleep -Milliseconds 500

              Log "Taking screenshot..."

              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

              $bitmap = New-Object System.Drawing.Bitmap(
                  $screen.Width,
                  $screen.Height
              )

              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

              $graphics.CopyFromScreen(
                  $screen.X,
                  $screen.Y,
                  0,
                  0,
                  $bitmap.Size
              )

              $bitmap.Save(
                  $screenshot,
                  [System.Drawing.Imaging.ImageFormat]::Png
              )

              $graphics.Dispose()
              $bitmap.Dispose()

              Log "Screenshot saved"

              # --------------------------------------------------------
              # Wait remaining 10 seconds
              # --------------------------------------------------------

              Log "Waiting 10 seconds after click..."

              Start-Sleep -Seconds 10

              # --------------------------------------------------------
              # Close red dot
              # --------------------------------------------------------

              $form.Close()
              $form.Dispose()

              Log "Red dot closed"

              # --------------------------------------------------------
              # Wait FFmpeg
              # --------------------------------------------------------

              Log "Waiting for FFmpeg..."

              $ffmpeg.WaitForExit()

              Log "FFmpeg exit code: $($ffmpeg.ExitCode)"

              # --------------------------------------------------------
              # Save FFmpeg logs
              # --------------------------------------------------------

              $stdout = $ffmpeg.StandardOutput.ReadToEnd()
              $stderr = $ffmpeg.StandardError.ReadToEnd()

              Set-Content `
                  -Path $ffmpegOut `
                  -Value $stdout `
                  -Encoding UTF8

              Set-Content `
                  -Path $ffmpegErr `
                  -Value $stderr `
                  -Encoding UTF8

              Log "FFmpeg stdout saved"
              Log "FFmpeg stderr saved"

              # --------------------------------------------------------
              # Check video
              # --------------------------------------------------------

              if (-not (Test-Path $video)) {

                  Log "ERROR: Video file was not created"

                  if (Test-Path $ffmpegErr) {
                      Log "===== FFMPEG ERROR ====="
                      Get-Content $ffmpegErr |
                          ForEach-Object {
                              Add-Content -Path $log -Value $_
                          }
                  }

                  exit 20
              }

              $size = (Get-Item $video).Length

              Log "Video size: $size bytes"

              if ($size -lt 10000) {

                  Log "ERROR: Video is suspiciously small"
                  exit 21
              }

              if (-not (Test-Path $screenshot)) {

                  Log "ERROR: Screenshot was not created"
                  exit 22
              }

              # --------------------------------------------------------
              # FFPROBE
              # --------------------------------------------------------

              Log "Running ffprobe..."

              $probe = & ffprobe `
                  -v error `
                  -show_entries `
                  format=format_name,duration,size `
                  -show_entries `
                  stream=codec_name,width,height,pix_fmt `
                  -of default=noprint_wrappers=1 `
                  $video 2>&1

              $probeText = $probe -join "`n"

              Log "===== FFPROBE ====="
              Log $probeText

              if ($LASTEXITCODE -ne 0) {

                  Log "ERROR: ffprobe failed"
                  exit 23
              }

              Log "===== RECORDING SUCCESS ====="

          }
          catch {

              Log "FATAL ERROR:"
              Log $_.Exception.ToString()

              try {
                  if ($form) {
                      $form.Close()
                      $form.Dispose()
                  }
              }
              catch {}

              exit 99
          }
          '@

          Set-Content `
            -Path "C:\temp\RDPClickAndRecord.ps1" `
            -Value $script `
            -Encoding UTF8

          Write-Host "Recording script created"


      # ============================================================
      # 9. CREATE RECORDING TASK
      # ============================================================
      - name: Create recording scheduled task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          schtasks /delete `
            /tn "RDPClickAndRecord" `
            /f 2>$null

          schtasks /create `
            /tn "RDPClickAndRecord" `
            /tr 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\temp\RDPClickAndRecord.ps1' `
            /sc ONCE `
            /st 00:00 `
            /sd 01/01/2030 `
            /ru runneradmin `
            /rp "WindowsRDP#2025" `
            /it `
            /f

          Write-Host "Recording task created"


      # ============================================================
      # 10. START RECORDING
      # ============================================================
      - name: Start recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting recording task..."

          schtasks /run /tn "RDPClickAndRecord"

          Start-Sleep -Seconds 2

          Write-Host "Recording task started"


      # ============================================================
      # 11. WAIT FOR RECORDING
      # ============================================================
      - name: Wait for recording completion
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $video = "C:\temp\rdp-click-video.mp4"
          $screenshot = "C:\temp\rdp-click-screenshot.png"
          $log = "C:\temp\click-record.log"

          $finished = $false

          for ($i = 1; $i -le 100; $i++) {

              Write-Host "Waiting... $i / 100"

              if ((Test-Path $video) -and (Test-Path $screenshot)) {

                  $size = (Get-Item $video).Length

                  if ($size -gt 10000) {

                      Write-Host "Recording files detected"

                      $finished = $true
                      break
                  }
              }

              Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SCHEDULED TASK STATUS"
          Write-Host "======================================"

          schtasks /query `
            /tn "RDPClickAndRecord" `
            /v `
            /fo LIST

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RECORDING LOG"
          Write-Host "======================================"

          if (Test-Path $log) {
              Get-Content $log
          }
          else {
              Write-Host "Recording log does not exist."
          }

          if (-not $finished) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "FFMPEG ERROR LOG"
              Write-Host "======================================"

              if (Test-Path "C:\temp\ffmpeg-error.log") {
                  Get-Content "C:\temp\ffmpeg-error.log"
              }

              throw "Recording did not finish successfully."
          }

          Write-Host "Recording completed successfully."


      # ============================================================
      # 12. VERIFY VIDEO
      # ============================================================
      - name: Verify video
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $video = "C:\temp\rdp-click-video.mp4"

          if (-not (Test-Path $video)) {
              throw "Video not found"
          }

          Write-Host "=== FILE ==="

          Get-Item $video |
            Select-Object FullName,Length,CreationTime |
            Format-List

          Write-Host ""
          Write-Host "=== FFPROBE ==="

          ffprobe `
            -v error `
            -show_entries `
            format=format_name,duration,size `
            -show_entries `
            stream=codec_name,width,height,pix_fmt `
            -of default=noprint_wrappers=1 `
            $video


      # ============================================================
      # 13. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-screenshot
          path: C:\temp\rdp-click-screenshot.png
          if-no-files-found: error


      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-video
          path: C:\temp\rdp-click-video.mp4
          if-no-files-found: error


      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-record-debug
          path: |
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
          if-no-files-found: ignore
