name: Windows RDP

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. RDP
      # =========================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rdpPassword = "WindowsRDP#2025"

          Write-Host "=== Configuring RDP ==="

          $user = "runneradmin"

          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue

          if (-not $existing) {
              $secure = ConvertTo-SecureString $rdpPassword -AsPlainText -Force
              New-LocalUser `
                -Name $user `
                -Password $secure `
                -FullName "Runner Admin" `
                -Description "GitHub Actions RDP user"
          }
          else {
              Write-Host "runneradmin already exists"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $user `
            -ErrorAction SilentlyContinue

          Write-Host "runneradmin is already Administrator"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Restart-Service TermService -Force

          Write-Host "RDP configuration complete"


      # =========================================================
      # 2. TAILSCALE
      # =========================================================
      - name: Install and start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing Tailscale ==="

          $ts = Get-Command tailscale.exe -ErrorAction SilentlyContinue

          if (-not $ts) {
              winget install `
                --id Tailscale.Tailscale `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              $tailscale = "tailscale.exe"
          }

          Write-Host "Starting Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp-3" `
            --accept-dns=true

          Start-Sleep -Seconds 3

          Write-Host "=== Tailscale status ==="
          & $tailscale status

          Write-Host ""
          Write-Host "=== Tailscale IPv4 ==="

          $ip = & $tailscale ip -4
          Write-Host $ip


      # =========================================================
      # 3. CHROME
      # =========================================================
      - name: Check Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Checking Chrome ==="

          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"

          if (-not (Test-Path $chrome)) {
              Write-Host "Chrome not found. Installing..."

              choco install googlechrome -y --no-progress
          }

          Write-Host "Chrome:"

          if (Test-Path $chrome) {
              Write-Host $chrome
          }
          else {
              throw "Chrome executable not found."
          }


      # =========================================================
      # 4. CHROME TASK
      # =========================================================
      - name: Create Chrome startup task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $password = "WindowsRDP#2025"

          schtasks.exe /delete `
            /tn "OpenChromeAutomatically" `
            /f 2>$null

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Old Chrome task does not exist. Continuing."
          }

          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"

          $taskCommand = "`"$chrome`" --start-maximized --no-first-run --disable-session-crashed-bubble https://github.com"

          schtasks.exe /create `
            /tn "OpenChromeAutomatically" `
            /tr $taskCommand `
            /sc ONLOGON `
            /ru "runneradmin" `
            /rp "$password" `
            /it `
            /f

          Write-Host "Chrome task created."

          schtasks.exe /query `
            /tn "OpenChromeAutomatically" `
            /v `
            /fo LIST


      # =========================================================
      # 5. RDP SESSION
      # =========================================================
      - name: Start RDP session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $password = "WindowsRDP#2025"

          Write-Host "=== Creating RDP credentials ==="

          cmdkey.exe /generic:"TERMSRV/127.0.0.1" `
            /user:"runneradmin" `
            /pass:"$password"

          cmdkey.exe /generic:"TERMSRV/localhost" `
            /user:"runneradmin" `
            /pass:"$password"

          Write-Host "Starting mstsc..."

          Start-Process mstsc.exe `
            -ArgumentList "/v:127.0.0.1 /f"

          Write-Host "Waiting 100 seconds for RDP..."

          Start-Sleep -Seconds 100

          Write-Host "=== QUSER ==="

          quser

          Write-Host "RDP session started"


      # =========================================================
      # 6. START CHROME
      # =========================================================
      - name: Start Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting Chrome..."

          schtasks.exe /run `
            /tn "OpenChromeAutomatically"

          Start-Sleep -Seconds 5

          Write-Host "=== Chrome processes ==="

          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, MainWindowTitle |
            Format-Table -AutoSize

          Write-Host "Waiting 100 seconds for website..."

          Start-Sleep -Seconds 100


      # =========================================================
      # 7. FFMPEG
      # =========================================================
      - name: Install FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing FFmpeg ==="

          choco install ffmpeg -y --no-progress

          Write-Host "=== FFmpeg version ==="

          ffmpeg -version

          Write-Host "=== FFprobe version ==="

          ffprobe -version


      # =========================================================
      # 8. CREATE RECORDING SCRIPT
      # =========================================================
      - name: Create recording script
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          $recordingScript = @'
$ErrorActionPreference = "Continue"

$log = "C:\temp\click-record.log"

function Log {
    param(
        [string]$Message
    )

    $line = "$(Get-Date -Format 'yyyy-MM-dd HH\:mm\:ss')  $Message"

    Add-Content `
        -Path $log `
        -Value $line `
        -Encoding UTF8

    Write-Host $line
}

$form = $null
$ffmpegProcess = $null

try {

    Log "======================================"
    Log "RECORDING SCRIPT STARTED"
    Log "======================================"

    # =========================================================
    # WINDOW API
    # =========================================================

    Add-Type @"
using System;
using System.Text;
using System.Runtime.InteropServices;

public static class WindowAPI
{
    public delegate bool EnumWindowsProc(
        IntPtr hWnd,
        IntPtr lParam
    );

    [DllImport("user32.dll")]
    public static extern bool EnumWindows(
        EnumWindowsProc callback,
        IntPtr lParam
    );

    [DllImport("user32.dll")]
    public static extern bool IsWindowVisible(
        IntPtr hWnd
    );

    [DllImport("user32.dll")]
    public static extern int GetWindowText(
        IntPtr hWnd,
        StringBuilder text,
        int count
    );

    [DllImport("user32.dll")]
    public static extern uint GetWindowThreadProcessId(
        IntPtr hWnd,
        out uint processId
    );

    [DllImport("user32.dll")]
    public static extern bool ShowWindow(
        IntPtr hWnd,
        int nCmdShow
    );

    [DllImport("user32.dll")]
    public static extern bool SetForegroundWindow(
        IntPtr hWnd
    );

    public const int SW_MINIMIZE = 6;
    public const int SW_MAXIMIZE = 3;
}
"@

    Log "WindowAPI loaded"

    # =========================================================
    # FIND CHROME
    # =========================================================

    $chromeProcesses = @(
        Get-Process chrome -ErrorAction SilentlyContinue
    )

    Log "Chrome process count: $($chromeProcesses.Count)"

    if ($chromeProcesses.Count -eq 0) {
        throw "Chrome not found."
    }

    $chromePids = @{}

    foreach ($chromeProcess in $chromeProcesses) {

        $chromePids[[uint32]$chromeProcess.Id] = $true

        Log "Chrome PID: $($chromeProcess.Id)"
    }

    # =========================================================
    # MINIMIZE OTHER WINDOWS
    # =========================================================

    Log "Minimizing other application windows..."

    [WindowAPI]::EnumWindows(
        {
            param(
                $hWnd,
                $lParam
            )

            try {

                if (-not [WindowAPI]::IsWindowVisible($hWnd)) {
                    return $true
                }

                $windowProcessId = [uint32]0

                [WindowAPI]::GetWindowThreadProcessId(
                    $hWnd,
                    [ref]$windowProcessId
                ) | Out-Null

                if ($chromePids.ContainsKey($windowProcessId)) {
                    return $true
                }

                $sb = New-Object System.Text.StringBuilder 512

                [WindowAPI]::GetWindowText(
                    $hWnd,
                    $sb,
                    $sb.Capacity
                ) | Out-Null

                $title = $sb.ToString()

                if ([string]::IsNullOrWhiteSpace($title)) {
                    return $true
                }

                Log "Minimize: $title"

                [WindowAPI]::ShowWindow(
                    $hWnd,
                    [WindowAPI]::SW_MINIMIZE
                ) | Out-Null

            }
            catch {

                Log "Minimize error: $($_.Exception.Message)"
            }

            return $true

        },
        [IntPtr]::Zero
    ) | Out-Null

    Start-Sleep -Seconds 1

    # =========================================================
    # FIND CHROME WINDOW
    # =========================================================

    $chromeWindow = [IntPtr]::Zero

    foreach ($chromeProcess in $chromeProcesses) {

        if ($chromeProcess.MainWindowHandle -ne 0) {

            $chromeWindow =
                $chromeProcess.MainWindowHandle

            break
        }
    }

    if ($chromeWindow -ne [IntPtr]::Zero) {

        [WindowAPI]::ShowWindow(
            $chromeWindow,
            [WindowAPI]::SW_MAXIMIZE
        ) | Out-Null

        [WindowAPI]::SetForegroundWindow(
            $chromeWindow
        ) | Out-Null

        Log "Chrome brought to foreground"
    }
    else {

        Log "WARNING: Chrome main window not found"
    }

    # =========================================================
    # WINDOWS FORMS
    # =========================================================

    Add-Type -AssemblyName System.Windows.Forms
    Add-Type -AssemblyName System.Drawing

    # =========================================================
    # RED DOT
    # CENTER = 84,614
    # =========================================================

    $form =
        New-Object System.Windows.Forms.Form

    $form.FormBorderStyle =
        [System.Windows.Forms.FormBorderStyle]::None

    $form.StartPosition =
        [System.Windows.Forms.FormStartPosition]::Manual

    $form.Location =
        New-Object System.Drawing.Point(79,609)

    $form.Size =
        New-Object System.Drawing.Size(10,10)

    $form.BackColor =
        [System.Drawing.Color]::Red

    $form.TopMost = $true
    $form.ShowInTaskbar = $false

    $form.Show()
    $form.Refresh()

    Log "Red dot created"

    # =========================================================
    # FILE PATHS
    # =========================================================

    $video =
        "C:\temp\rdp-click-video.mp4"

    $screenshot =
        "C:\temp\rdp-click-screenshot.png"

    $ffmpegOut =
        "C:\temp\ffmpeg-output.log"

    $ffmpegErr =
        "C:\temp\ffmpeg-error.log"

    Remove-Item `
        $video,
        $screenshot,
        $ffmpegOut,
        $ffmpegErr `
        -Force `
        -ErrorAction SilentlyContinue

    # =========================================================
    # START FFMPEG
    # =========================================================

    Log "Starting FFmpeg desktop capture"

    $ffmpegArgs =
        '-y -loglevel warning -f gdigrab -framerate 10 -draw_mouse 1 -i desktop -t 15 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart "C:\temp\rdp-click-video.mp4"'

    Log "FFmpeg arguments: $ffmpegArgs"

    $ffmpegProcess = Start-Process `
        -FilePath "ffmpeg.exe" `
        -ArgumentList $ffmpegArgs `
        -RedirectStandardOutput $ffmpegOut `
        -RedirectStandardError $ffmpegErr `
        -PassThru `
        -WindowStyle Hidden

    if ($null -eq $ffmpegProcess) {
        throw "FFmpeg process object is null."
    }

    Log "FFmpeg PID: $($ffmpegProcess.Id)"

    # =========================================================
    # WAIT 5 SECONDS
    # =========================================================

    Log "Recording 5 seconds before click"

    Start-Sleep -Seconds 5

    # =========================================================
    # MOUSE API
    # =========================================================

    Add-Type @"
using System;
using System.Runtime.InteropServices;

public static class MouseAPI
{
    [DllImport("user32.dll")]
    public static extern bool SetCursorPos(
        int X,
        int Y
    );

    [DllImport("user32.dll")]
    public static extern void mouse_event(
        uint flags,
        uint dx,
        uint dy,
        uint data,
        UIntPtr extraInfo
    );

    public const uint LEFTDOWN = 0x0002;
    public const uint LEFTUP = 0x0004;
}
"@

    # =========================================================
    # CLICK EXACTLY 84,614
    # =========================================================

    Log "CLICK X=84 Y=614"

    [MouseAPI]::SetCursorPos(
        84,
        614
    ) | Out-Null

    Start-Sleep -Milliseconds 200

    [MouseAPI]::mouse_event(
        [MouseAPI]::LEFTDOWN,
        0,
        0,
        0,
        [UIntPtr]::Zero
    )

    Start-Sleep -Milliseconds 100

    [MouseAPI]::mouse_event(
        [MouseAPI]::LEFTUP,
        0,
        0,
        0,
        [UIntPtr]::Zero
    )

    Log "Mouse click completed"

    # =========================================================
    # SCREENSHOT
    # =========================================================

    Start-Sleep -Milliseconds 500

    Log "Taking screenshot"

    $bounds =
        [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

    $bitmap =
        New-Object System.Drawing.Bitmap(
            $bounds.Width,
            $bounds.Height
        )

    $graphics =
        [System.Drawing.Graphics]::FromImage(
            $bitmap
        )

    $graphics.CopyFromScreen(
        $bounds.X,
        $bounds.Y,
        0,
        0,
        $bitmap.Size
    )

    $bitmap.Save(
        $screenshot,
        [System.Drawing.Imaging.ImageFormat]::Png
    )

    $graphics.Dispose()
    $bitmap.Dispose()

    Log "Screenshot saved"

    # =========================================================
    # WAIT 10 SECONDS AFTER CLICK
    # =========================================================

    Log "Recording 10 seconds after click"

    Start-Sleep -Seconds 10

    # =========================================================
    # CLOSE RED DOT
    # =========================================================

    if ($form) {

        $form.Close()
        $form.Dispose()
        $form = $null
    }

    Log "Red dot closed"

    # =========================================================
    # WAIT FOR FFMPEG
    # =========================================================

    Log "Waiting for FFmpeg"

    $ffmpegProcess.WaitForExit()

    Log "FFmpeg exit code: $($ffmpegProcess.ExitCode)"

    if (Test-Path $ffmpegErr) {

        Log "FFmpeg error log created"
    }

    # =========================================================
    # VERIFY VIDEO
    # =========================================================

    if (-not (Test-Path $video)) {

        throw "Video file was not created."
    }

    $videoInfo = Get-Item $video

    Log "Video size: $($videoInfo.Length) bytes"

    if ($videoInfo.Length -lt 10000) {

        throw "Video file is too small."
    }

    # =========================================================
    # VERIFY SCREENSHOT
    # =========================================================

    if (-not (Test-Path $screenshot)) {

        throw "Screenshot was not created."
    }

    $screenshotInfo = Get-Item $screenshot

    Log "Screenshot size: $($screenshotInfo.Length) bytes"

    # =========================================================
    # FFPROBE
    # =========================================================

    Log "Running ffprobe"

    $probe =
        & ffprobe.exe `
            -v error `
            -show_entries format=format_name,duration,size `
            -show_entries stream=codec_name,width,height,pix_fmt `
            -of default=noprint_wrappers=1 `
            "$video" 2>&1

    foreach ($line in $probe) {

        Log "FFPROBE: $line"
    }

    Log "======================================"
    Log "RECORDING COMPLETED SUCCESSFULLY"
    Log "======================================"

    exit 0

}
catch {

    Log "======================================"
    Log "FATAL ERROR"
    Log "======================================"

    Log $_.Exception.ToString()

    if ($form) {

        try {
            $form.Close()
            $form.Dispose()
        }
        catch {}
    }

    if ($ffmpegProcess) {

        try {

            if (-not $ffmpegProcess.HasExited) {

                Log "Stopping FFmpeg after fatal error"

                $ffmpegProcess.Kill()
                $ffmpegProcess.WaitForExit()
            }
        }
        catch {}
    }

    exit 99
}
'@

          $scriptPath = "C:\temp\RDPClickAndRecord.ps1"

          $recordingScript |
            Set-Content `
              -Path $scriptPath `
              -Encoding UTF8

          Write-Host "Recording script created:"
          Write-Host $scriptPath

          Write-Host "=== Testing PowerShell parser ==="

          & powershell.exe `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -Command "& { [void][System.Management.Automation.Language.Parser]::ParseFile('C:\temp\RDPClickAndRecord.ps1',[ref]`$null,[ref]`$null); Write-Host 'PowerShell parser: OK' }"

          if ($LASTEXITCODE -ne 0) {
              throw "PowerShell parser failed."
          }


      # =========================================================
      # 9. LAUNCHER
      # =========================================================
      - name: Create recording launcher
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $launcher = @'
@echo off

echo TASK STARTED > C:\temp\task-started.txt

echo [%date% %time%] Launcher started >> C:\temp\task-launcher.log

C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe ^
-NoProfile ^
-NonInteractive ^
-ExecutionPolicy Bypass ^
-File "C:\temp\RDPClickAndRecord.ps1" ^
>> C:\temp\task-powershell-output.log 2>&1

echo [%date% %time%] PowerShell exit code: %ERRORLEVEL% >> C:\temp\task-launcher.log

exit /b %ERRORLEVEL%
'@

          $launcher |
            Set-Content `
              -Path "C:\temp\record-launcher.cmd" `
              -Encoding ASCII

          Write-Host "Launcher created."


      # =========================================================
      # 10. CREATE RECORDING TASK
      # =========================================================
      - name: Create recording task
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $password = "WindowsRDP#2025"

          Write-Host "=== Active session ==="

          quser

          Write-Host "=== Removing old recording task ==="

          schtasks.exe /delete `
            /tn "RDPClickAndRecord" `
            /f 2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Host "Old recording task does not exist."
          }

          Write-Host "=== Creating recording task ==="

          schtasks.exe /create `
            /tn "RDPClickAndRecord" `
            /tr "C:\temp\record-launcher.cmd" `
            /sc ONLOGON `
            /ru "runneradmin" `
            /rp "$password" `
            /it `
            /f

          if ($LASTEXITCODE -ne 0) {

              throw "Failed to create recording task."
          }

          schtasks.exe /query `
            /tn "RDPClickAndRecord" `
            /v `
            /fo LIST


      # =========================================================
      # 11. RUN RECORDING
      # =========================================================
      - name: Run recording
        shell: powershell
        run: |

          $ErrorActionPreference = "Continue"

          $video =
            "C:\temp\rdp-click-video.mp4"

          $screenshot =
            "C:\temp\rdp-click-screenshot.png"

          $taskStarted =
            "C:\temp\task-started.txt"

          $recordLog =
            "C:\temp\click-record.log"

          $launcherLog =
            "C:\temp\task-launcher.log"

          $powershellLog =
            "C:\temp\task-powershell-output.log"

          Remove-Item `
            $video,
            $screenshot,
            $taskStarted,
            $recordLog,
            $launcherLog,
            $powershellLog `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Starting recording task..."

          schtasks.exe /run `
            /tn "RDPClickAndRecord"

          Start-Sleep -Seconds 2

          Write-Host "Waiting for recording..."

          $finished = $false

          for ($i = 1; $i -le 60; $i++) {

              if (($i % 5) -eq 0) {

                  Write-Host "Waiting... $i / 60"
              }

              if (
                  (Test-Path $video) -and
                  (Test-Path $screenshot)
              ) {

                  $size =
                    (Get-Item $video).Length

                  if ($size -gt 10000) {

                      $finished = $true

                      Write-Host "Recording files detected."

                      break
                  }
              }

              Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TASK STATUS"
          Write-Host "=========================================="

          schtasks.exe /query `
            /tn "RDPClickAndRecord" `
            /v `
            /fo LIST

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TASK STARTED"
          Write-Host "=========================================="

          if (Test-Path $taskStarted) {
              Get-Content $taskStarted
          }
          else {
              Write-Host "TASK STARTED FILE NOT FOUND"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LAUNCHER LOG"
          Write-Host "=========================================="

          if (Test-Path $launcherLog) {
              Get-Content $launcherLog
          }
          else {
              Write-Host "Launcher log not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "POWERSHELL OUTPUT"
          Write-Host "=========================================="

          if (Test-Path $powershellLog) {
              Get-Content $powershellLog
          }
          else {
              Write-Host "PowerShell output not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RECORDING LOG"
          Write-Host "=========================================="

          if (Test-Path $recordLog) {
              Get-Content $recordLog
          }
          else {
              Write-Host "Recording log not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FFMPEG ERROR"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\ffmpeg-error.log") {
              Get-Content "C:\temp\ffmpeg-error.log"
          }
          else {
              Write-Host "FFmpeg error log not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FFMPEG OUTPUT"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\ffmpeg-output.log") {
              Get-Content "C:\temp\ffmpeg-output.log"
          }
          else {
              Write-Host "FFmpeg output log not found."
          }

          if (-not $finished) {

              throw "Recording did not finish."
          }

          Write-Host "Recording completed successfully."


      # =========================================================
      # 12. SCREENSHOT
      # =========================================================
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-screenshot
          path: C:\temp\rdp-click-screenshot.png
          if-no-files-found: warn


      # =========================================================
      # 13. VIDEO
      # =========================================================
      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-video
          path: C:\temp\rdp-click-video.mp4
          if-no-files-found: warn


      # =========================================================
      # 14. DEBUG
      # =========================================================
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-record-debug
          path: |
            C:\temp\click-record.log
            C:\temp\task-started.txt
            C:\temp\task-launcher.log
            C:\temp\task-powershell-output.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
          if-no-files-found: warn
