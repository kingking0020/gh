name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      RDP_USERNAME: runneradmin
      RDP_PASSWORD: "RdpAccess#2026X"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show runner information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "User:"
          whoami
          Write-Host "Computer:"
          hostname

      - name: Show RDP login
        shell: powershell
        run: |
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"

      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($null -ne $existingUser) {
              Set-LocalUser -Name $username -Password $securePassword -ErrorAction Stop
          } else {
              New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires -UserMayNotChangePassword -Description "Temporary GitHub Actions RDP account" -ErrorAction Stop
          }

          $adminMember = Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "\\$([regex]::Escape($username))$" }
          if ($null -eq $adminMember) {
              Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction Stop
          }

          $rdpMember = Get-LocalGroupMember -Group "Remote Desktop Users" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "\\$([regex]::Escape($username))$" }
          if ($null -eq $rdpMember) {
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction Stop
          }

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1 -Force

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Enable-NetFirewallRule -ErrorAction SilentlyContinue

          Set-Service -Name "TermService" -StartupType Automatic -ErrorAction Stop
          Restart-Service -Name "TermService" -Force -ErrorAction Stop
          Start-Sleep -Seconds 4
          Write-Host "RDP configured successfully."

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscaleExe)) {
              $installer = "$env:TEMP\tailscale-setup.exe"
              Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer
              Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait
              Start-Sleep -Seconds 5
          }

          & $tailscaleExe up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="github-actions-rdp-3" --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "Tailscale failed to connect." }

          Start-Sleep -Seconds 5
          $tailscaleIP = (& $tailscaleExe ip -4 | Out-String).Trim()
          Write-Host "Tailscale IP: $tailscaleIP"
          "TAILSCALE_IP=$tailscaleIP" | Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Check and install Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $chromePath = $null
          foreach ($path in $paths) {
              if (Test-Path $path) { $chromePath = $path; break }
          }
          if (-not $chromePath) {
              choco install googlechrome -y --no-progress
              Start-Sleep -Seconds 6
              foreach ($path in $paths) {
                  if (Test-Path $path) { $chromePath = $path; break }
              }
          }
          if (-not $chromePath) { throw "Chrome executable was not found." }
          "CHROME_PATH=$chromePath" | Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Prepare Chrome profile
        shell: powershell
        run: |
          $chromeProfile = "C:\temp\ChromeProfile"
          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-Item $chromeProfile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $chromeProfile -Force | Out-Null
          Write-Host "Chrome profile ready."

      - name: Minimize all windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          try {
              $shell = New-Object -ComObject Shell.Application
              $shell.MinimizeAll()
          } catch {
              Write-Host "MinimizeAll failed: $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 2

      - name: Start Chrome with debugging port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $chromePath = $env:CHROME_PATH
          if (-not (Test-Path $chromePath)) { throw "Chrome executable does not exist." }

          $chromeProfile = "C:\temp\ChromeProfile"

          $arguments = @(
            "--no-first-run"
            "--no-default-browser-check"
            "--disable-session-crashed-bubble"
            "--disable-features=Translate"
            "--start-maximized"
            "--new-window"
            "--user-data-dir=$chromeProfile"
            "--remote-debugging-port=9222"

            # ------------------------------------------------------
            # URL را اینجا تغییر بده
            # ------------------------------------------------------
            "https://nanswap.com/nano-faucet"
          )

          $chromeProcess = Start-Process -FilePath $chromePath -ArgumentList $arguments -PassThru
          if ($null -eq $chromeProcess) { throw "Chrome failed to start." }
          Write-Host "Chrome PID: $($chromeProcess.Id)"

          Start-Sleep -Seconds 10

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class ChromeWindow
          {
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
              public const int SW_MAXIMIZE = 3;
          }
"@

          $chromeWindow = Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Sort-Object StartTime -Descending | Select-Object -First 1
          if ($null -eq $chromeWindow) { throw "Chrome window was not found." }

          [ChromeWindow]::ShowWindow($chromeWindow.MainWindowHandle, [ChromeWindow]::SW_MAXIMIZE) | Out-Null
          Start-Sleep -Milliseconds 800
          [ChromeWindow]::SetForegroundWindow($chromeWindow.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2

          Write-Host "Chrome is maximized and in foreground."

      - name: Install FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
              choco install ffmpeg -y --no-progress
              Start-Sleep -Seconds 5
          }
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ffmpeg) { throw "FFmpeg was not found." }
          Write-Host "FFmpeg: $($ffmpeg.Source)"

      - name: Create recording script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null

          $recordingScript = @'
          $ErrorActionPreference = "Stop"

          $logFile       = "C:\temp\click-record.log"
          $videoFile     = "C:\temp\rdp-click-video.mp4"
          $screenshotFile= "C:\temp\rdp-click-screenshot.png"
          $ffmpegOutput  = "C:\temp\ffmpeg-output.log"
          $ffmpegError   = "C:\temp\ffmpeg-error.log"

          function Log($text) {
              $line = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff')  $text"
              Write-Host $line
              Add-Content -Path $logFile -Value $line
          }

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWin
          {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              public const int SW_RESTORE = 9;
              public const int SW_MAXIMIZE = 3;
          }
"@

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          if ($null -eq $screen) { throw "Primary screen is null." }

          $screenX = $screen.Bounds.X
          $screenY = $screen.Bounds.Y
          $width   = $screen.Bounds.Width
          $height  = $screen.Bounds.Height

          Log "Screen: X=$screenX Y=$screenY W=$width H=$height"

          Log "Finding Chrome window..."
          $chromeWindow = $null
          for ($attempt = 1; $attempt -le 20; $attempt++) {
              $chromeWindow = Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Sort-Object StartTime -Descending | Select-Object -First 1
              if ($null -ne $chromeWindow) { break }
              Start-Sleep -Milliseconds 500
          }
          if ($null -eq $chromeWindow) { throw "Chrome window was not found." }

          [NativeWin]::ShowWindow($chromeWindow.MainWindowHandle, [NativeWin]::SW_RESTORE) | Out-Null
          Start-Sleep -Milliseconds 300
          [NativeWin]::ShowWindow($chromeWindow.MainWindowHandle, [NativeWin]::SW_MAXIMIZE) | Out-Null
          Start-Sleep -Milliseconds 500
          [NativeWin]::SetForegroundWindow($chromeWindow.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          Log "Chrome maximized and activated."

          Remove-Item $videoFile -Force -ErrorAction SilentlyContinue
          Remove-Item $screenshotFile -Force -ErrorAction SilentlyContinue
          Remove-Item $ffmpegOutput -Force -ErrorAction SilentlyContinue
          Remove-Item $ffmpegError -Force -ErrorAction SilentlyContinue

          Log "Starting 20 second FFmpeg recording..."

          $ffmpegArgs = @(
              "-y"
              "-f" "gdigrab"
              "-framerate" "30"
              "-draw_mouse" "1"
              "-i" "desktop"
              "-t" "20"
              "-c:v" "libx264"
              "-preset" "veryfast"
              "-pix_fmt" "yuv420p"
              $videoFile
          )

          $ffmpegProcess = Start-Process -FilePath "ffmpeg.exe" -ArgumentList $ffmpegArgs -PassThru -RedirectStandardOutput $ffmpegOutput -RedirectStandardError $ffmpegError
          Log "FFmpeg PID = $($ffmpegProcess.Id)"

          Log "Waiting 5 seconds before typing..."
          Start-Sleep -Seconds 5

          # ==========================================================
          # TYPE INTO ELEMENT VIA CDP
          # ==========================================================

          $nanoAddress     = "nano_39zkq6o8tkqpmsg5f3csyzs4oy66sofuerbdyeagaxih5pzea3956q3619no"
          $elementSelector = "address"

          Log "Connecting to Chrome DevTools Protocol on port 9222..."

          $targets = $null
          for ($i = 0; $i -lt 20; $i++) {
              try {
                  $targets = Invoke-RestMethod "http://localhost:9222/json"
                  if ($targets) { break }
              } catch {}
              Start-Sleep -Milliseconds 500
          }
          if (-not $targets) { throw "Could not connect to Chrome debug port 9222." }

          $page = $targets | Where-Object { $_.type -eq 'page' } | Select-Object -First 1
          if (-not $page) { throw "No active page found in Chrome." }
          Log "Found page: $($page.url)"

          $wsUrl = $page.webSocketDebuggerUrl
          Log "WebSocket: $wsUrl"

          $ws = New-Object System.Net.WebSockets.ClientWebSocket
          $ct = [System.Threading.CancellationToken]::None
          $ws.ConnectAsync([Uri]$wsUrl, $ct).Wait()
          Log "WebSocket connected."

          $js = @"
(function(){
  var el = document.getElementById('$elementSelector');
  if (!el) return 'NOT_FOUND';
  el.focus();
  var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
  setter.call(el, '$nanoAddress');
  el.dispatchEvent(new Event('input', {bubbles:true}));
  el.dispatchEvent(new Event('change', {bubbles:true}));
  el.dispatchEvent(new Event('blur', {bubbles:true}));
  return 'OK: ' + el.value;
})()
"@

          $msg = @{
              id = 1
              method = "Runtime.evaluate"
              params = @{ expression = $js; returnByValue = $true }
          } | ConvertTo-Json -Compress -Depth 10

          Log "Sending CDP command..."

          $bytes = [System.Text.Encoding]::UTF8.GetBytes($msg)
          $seg = New-Object System.ArraySegment[byte] -ArgumentList @(,$bytes)
          $ws.SendAsync($seg, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $ct).Wait()

          $buf = New-Object byte[] 16384
          $recvSeg = New-Object System.ArraySegment[byte] -ArgumentList @(,$buf)
          $result = $ws.ReceiveAsync($recvSeg, $ct).Result
          $resp = [System.Text.Encoding]::UTF8.GetString($buf, 0, $result.Count)

          Log "CDP Response: $resp"

          $ws.CloseAsync([System.Net.WebSockets.WebSocketCloseStatus]::NormalClosure, "done", $ct).Wait()
          $ws.Dispose()
          Log "Typing via CDP COMPLETED."

          Log "Waiting 10 more seconds to finish recording..."
          Start-Sleep -Seconds 10

          Log "Waiting for FFmpeg to finish..."
          if (-not $ffmpegProcess.HasExited) {
              $ffmpegProcess.WaitForExit()
          }
          Log "FFmpeg exit code = $($ffmpegProcess.ExitCode)"

          if (-not (Test-Path $videoFile)) { throw "Video file was not created." }
          Log "Video size = $((Get-Item $videoFile).Length) bytes"

          # ==========================================================
          # FINAL SCREENSHOT
          # ==========================================================
          Log "Taking final screenshot..."

          $bitmap = New-Object System.Drawing.Bitmap($width, $height, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screenX, $screenY, 0, 0, $screen.Bounds.Size)

          $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::Red, 3)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(140, 255, 0, 0))

          # نقطه قرمز روی input (سمت چپ وسط صفحه)
          $dotX = [int]($width / 2)
          $dotY = [int]($height / 2)
          $radius = 8

          $graphics.FillEllipse($brush, ($dotX - $radius), ($dotY - $radius), ($radius * 2), ($radius * 2))
          $graphics.DrawEllipse($pen, ($dotX - $radius), ($dotY - $radius), ($radius * 2), ($radius * 2))

          $bitmap.Save($screenshotFile, [System.Drawing.Imaging.ImageFormat]::Png)

          $pen.Dispose()
          $brush.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()

          Log "Final screenshot saved."

          Log "ALL OPERATIONS COMPLETED"
          exit 0
'@

          Set-Content -Path "C:\temp\RDPClickAndRecord.ps1" -Value $recordingScript -Encoding UTF8

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("C:\temp\RDPClickAndRecord.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              foreach ($e in $errors) { Write-Host $e.ToString() }
              throw "Recording script has PowerShell syntax errors."
          }
          Write-Host "Recording script created and syntax OK."

      - name: Run recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = "C:\temp\RDPClickAndRecord.ps1"
          if (-not (Test-Path $scriptPath)) { throw "Recording script not found." }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Recording script failed with exit code $exitCode." }

      - name: Debug outputs
        if: always()
        shell: powershell
        run: |
          Write-Host "=== CLICK LOG ==="
          if (Test-Path "C:\temp\click-record.log") {
              Get-Content "C:\temp\click-record.log"
          }
          Write-Host "=== FFMPEG ERROR ==="
          if (Test-Path "C:\temp\ffmpeg-error.log") {
              Get-Content "C:\temp\ffmpeg-error.log"
          }

      - name: Upload recording outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rdp-record-output
          path: |
            C:\temp\rdp-click-screenshot.png
            C:\temp\rdp-click-video.mp4
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
            C:\temp\RDPClickAndRecord.ps1
          if-no-files-found: warn
          retention-days: 7
