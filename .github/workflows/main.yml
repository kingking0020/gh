name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Configuring RDP ==="

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          $username = "runneradmin"
          $password = "WindowsRDP#2025"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

              Write-Host "Creating $username"

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName "Runner Administrator" `
                -Description "GitHub Actions RDP User"
          }
          else {

              Write-Host "$username already exists"

              Set-LocalUser `
                -Name $username `
                -Password $securePassword
          }

          $member = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\$username$"
            }

          if (-not $member) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $username

              Write-Host "$username added to Administrators"
          }
          else {

              Write-Host "$username is already Administrator"
          }

          Write-Host "RDP configuration complete"


      # ============================================================
      # 2. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing Tailscale ==="

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found"
          }

          Write-Host "Starting Tailscale..."

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp"

          Start-Sleep -Seconds 10

          Write-Host "=== Tailscale status ==="

          & $tailscale status

          Write-Host "=== Tailscale IPv4 ==="

          & $tailscale ip -4


      # ============================================================
      # 3. CHROME
      # ============================================================
      - name: Install Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Checking Chrome ==="

          $chromePaths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chrome) {

            Write-Host "Chrome not found. Installing..."

            $installer = "$env:TEMP\chrome_installer.exe"

            Invoke-WebRequest `
              -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/silent","/install" `
              -Wait

            Start-Sleep -Seconds 5

            $chrome = $chromePaths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $chrome) {
            throw "Chrome installation failed"
          }

          Write-Host "Chrome:"
          Write-Host $chrome


      # ============================================================
      # 4. CHROME STARTUP TASK
      # ============================================================
      - name: Create Chrome startup task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force | Out-Null

          $chromeScript = @'
          $ErrorActionPreference = "Continue"

          $chromePaths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chrome) {
            exit 1
          }

          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Start-Process `
            -FilePath $chrome `
            -ArgumentList @(
              "--no-first-run",
              "--no-default-browser-check",
              "--disable-features=WelcomeToChrome",
              "--start-maximized",
              "https://github.com"
            )
          '@

          Set-Content `
            -Path "C:\temp\OpenChrome.ps1" `
            -Value $chromeScript `
            -Encoding UTF8

          & schtasks.exe /delete `
            /tn "OpenChromeAutomatically" `
            /f

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Old Chrome task does not exist. Continuing."
          }

          & schtasks.exe /create `
            /tn "OpenChromeAutomatically" `
            /tr 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\temp\OpenChrome.ps1' `
            /sc ONLOGON `
            /ru runneradmin `
            /rp "WindowsRDP#2025" `
            /it `
            /f

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create Chrome task"
          }

          Write-Host "Chrome task created."

          schtasks.exe /query `
            /tn "OpenChromeAutomatically" `
            /fo LIST


      # ============================================================
      # 5. START RDP
      # ============================================================
      - name: Start RDP session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Creating RDP credentials ==="

          cmdkey `
            /generic:TERMSRV/127.0.0.1 `
            /user:runneradmin `
            /pass:"WindowsRDP#2025"

          cmdkey `
            /generic:TERMSRV/localhost `
            /user:runneradmin `
            /pass:"WindowsRDP#2025"

          Write-Host "Starting mstsc..."

          Start-Process `
            "mstsc.exe" `
            -ArgumentList "/v:127.0.0.1 /f"

          Write-Host "Waiting 100 seconds for RDP..."

          Start-Sleep -Seconds 100

          Write-Host "=== QUSER ==="

          quser

          Write-Host "RDP session started"


      # ============================================================
      # 6. START CHROME
      # ============================================================
      - name: Start Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting Chrome..."

          & schtasks.exe /run `
            /tn "OpenChromeAutomatically"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start Chrome task"
          }

          Start-Sleep -Seconds 10

          Write-Host "=== Chrome processes ==="

          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,MainWindowTitle |
            Format-Table -AutoSize

          Write-Host "Waiting 100 seconds for website..."

          Start-Sleep -Seconds 100


      # ============================================================
      # 7. FFMPEG
      # ============================================================
      - name: Install FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Installing FFmpeg ==="

          choco install ffmpeg `
            -y `
            --no-progress

          $ffmpeg = Get-Command ffmpeg `
            -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {
            throw "FFmpeg command not found"
          }

          Write-Host "=== FFmpeg version ==="

          ffmpeg -version


      # ============================================================
      # 8. CREATE RECORDING SCRIPT
      # ============================================================
      - name: Create recording script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force | Out-Null

          $recordingScript = @'
          $ErrorActionPreference = "Continue"

          $log = "C:\temp\click-record.log"

          function Log {
              param(
                  [string]$Message
              )

              $line = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')  $Message"

              Add-Content `
                -Path $log `
                -Value $line `
                -Encoding UTF8

              Write-Host $line
          }

          $form = $null
          $ffmpeg = $null

          try {

              Log "======================================"
              Log "RECORDING SCRIPT STARTED"
              Log "======================================"

              # ======================================================
              # WINDOW API
              # ======================================================

              Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public static class WindowAPI
          {
              public delegate bool EnumWindowsProc(
                  IntPtr hWnd,
                  IntPtr lParam
              );

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(
                  EnumWindowsProc callback,
                  IntPtr lParam
              );

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(
                  IntPtr hWnd
              );

              [DllImport("user32.dll")]
              public static extern int GetWindowText(
                  IntPtr hWnd,
                  StringBuilder text,
                  int count
              );

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(
                  IntPtr hWnd,
                  out uint processId
              );

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(
                  IntPtr hWnd
              );

              public const int SW_MINIMIZE = 6;
              public const int SW_MAXIMIZE = 3;
          }
          "@

              Log "WindowAPI loaded"

              # ======================================================
              # FIND CHROME
              # ======================================================

              $chromeProcesses = @(
                  Get-Process chrome `
                    -ErrorAction SilentlyContinue
              )

              Log "Chrome process count: $($chromeProcesses.Count)"

              if ($chromeProcesses.Count -eq 0) {

                  Log "ERROR: Chrome not found"

                  exit 10
              }

              $chromePids = @{}

              foreach ($p in $chromeProcesses) {

                  $chromePids[[uint32]$p.Id] = $true

                  Log "Chrome PID: $($p.Id)"
              }

              # ======================================================
              # MINIMIZE OTHER WINDOWS
              # ======================================================

              Log "Minimizing other application windows..."

              [WindowAPI]::EnumWindows(
                  {
                      param(
                          $hWnd,
                          $lParam
                      )

                      try {

                          if (-not [WindowAPI]::IsWindowVisible($hWnd)) {
                              return $true
                          }

                          $pid = [uint32]0

                          [WindowAPI]::GetWindowThreadProcessId(
                              $hWnd,
                              [ref]$pid
                          ) | Out-Null

                          if ($chromePids.ContainsKey($pid)) {
                              return $true
                          }

                          $sb =
                              New-Object System.Text.StringBuilder 512

                          [WindowAPI]::GetWindowText(
                              $hWnd,
                              $sb,
                              $sb.Capacity
                          ) | Out-Null

                          $title = $sb.ToString()

                          if ([string]::IsNullOrWhiteSpace($title)) {
                              return $true
                          }

                          Log "Minimize: $title"

                          [WindowAPI]::ShowWindow(
                              $hWnd,
                              [WindowAPI]::SW_MINIMIZE
                          ) | Out-Null

                      }
                      catch {

                          Log "Minimize error: $($_.Exception.Message)"
                      }

                      return $true

                  },
                  [IntPtr]::Zero
              ) | Out-Null

              Start-Sleep -Seconds 1

              # ======================================================
              # BRING CHROME TO FRONT
              # ======================================================

              $chromeWindow = [IntPtr]::Zero

              foreach ($p in $chromeProcesses) {

                  if ($p.MainWindowHandle -ne 0) {

                      $chromeWindow =
                          $p.MainWindowHandle

                      break
                  }
              }

              if ($chromeWindow -ne [IntPtr]::Zero) {

                  [WindowAPI]::ShowWindow(
                      $chromeWindow,
                      [WindowAPI]::SW_MAXIMIZE
                  ) | Out-Null

                  [WindowAPI]::SetForegroundWindow(
                      $chromeWindow
                  ) | Out-Null

                  Log "Chrome brought to foreground"
              }
              else {

                  Log "WARNING: Chrome main window not found"
              }

              # ======================================================
              # WINDOWS FORMS
              # ======================================================

              Add-Type `
                -AssemblyName System.Windows.Forms

              Add-Type `
                -AssemblyName System.Drawing

              # ======================================================
              # RED DOT
              # Center = 84,614
              # ======================================================

              $form =
                  New-Object System.Windows.Forms.Form

              $form.FormBorderStyle =
                  [System.Windows.Forms.FormBorderStyle]::None

              $form.StartPosition =
                  [System.Windows.Forms.FormStartPosition]::Manual

              $form.Location =
                  New-Object System.Drawing.Point(79,609)

              $form.Size =
                  New-Object System.Drawing.Size(10,10)

              $form.BackColor =
                  [System.Drawing.Color]::Red

              $form.TopMost = $true

              $form.ShowInTaskbar = $false

              $form.Show()

              $form.Refresh()

              Log "Red dot created"

              # ======================================================
              # FILE PATHS
              # ======================================================

              $video =
                  "C:\temp\rdp-click-video.mp4"

              $screenshot =
                  "C:\temp\rdp-click-screenshot.png"

              $ffmpegOut =
                  "C:\temp\ffmpeg-output.log"

              $ffmpegErr =
                  "C:\temp\ffmpeg-error.log"

              Remove-Item `
                  $video,
                  $screenshot,
                  $ffmpegOut,
                  $ffmpegErr `
                  -Force `
                  -ErrorAction SilentlyContinue

              # ======================================================
              # START FFMPEG
              # ======================================================

              Log "Starting FFmpeg desktop capture"

              $ffmpegArguments = @(
                  "-y",
                  "-loglevel", "warning",
                  "-f", "gdigrab",
                  "-framerate", "10",
                  "-draw_mouse", "1",
                  "-i", "desktop",
                  "-t", "15",
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-pix_fmt", "yuv420p",
                  "-movflags", "+faststart",
                  $video
              )

              Log (
                  "FFmpeg arguments: " +
                  ($ffmpegArguments -join " ")
              )

              $ffmpegStartInfo =
                  New-Object System.Diagnostics.ProcessStartInfo

              $ffmpegStartInfo.FileName =
                  "ffmpeg.exe"

              $ffmpegStartInfo.UseShellExecute =
                  $false

              $ffmpegStartInfo.CreateNoWindow =
                  $true

              $ffmpegStartInfo.RedirectStandardOutput =
                  $true

              $ffmpegStartInfo.RedirectStandardError =
                  $true

              foreach ($arg in $ffmpegArguments) {

                  [void]$ffmpegStartInfo.ArgumentList.Add($arg)
              }

              $ffmpeg =
                  New-Object System.Diagnostics.Process

              $ffmpeg.StartInfo =
                  $ffmpegStartInfo

              if (-not $ffmpeg.Start()) {

                  Log "ERROR: FFmpeg failed to start"

                  exit 30
              }

              Log "FFmpeg PID: $($ffmpeg.Id)"

              # Read output asynchronously BEFORE waiting.
              $stdoutTask =
                  $ffmpeg.StandardOutput.ReadToEndAsync()

              $stderrTask =
                  $ffmpeg.StandardError.ReadToEndAsync()

              # ======================================================
              # WAIT 5 SECONDS BEFORE CLICK
              # ======================================================

              Log "Recording 5 seconds before click"

              Start-Sleep -Seconds 5

              # ======================================================
              # MOUSE API
              # ======================================================

              Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class MouseAPI
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(
                  int X,
                  int Y
              );

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint flags,
                  uint dx,
                  uint dy,
                  uint data,
                  UIntPtr extraInfo
              );

              public const uint LEFTDOWN = 0x0002;
              public const uint LEFTUP = 0x0004;
          }
          "@

              # ======================================================
              # CLICK 84,614
              # ======================================================

              Log "CLICK X=84 Y=614"

              [MouseAPI]::SetCursorPos(
                  84,
                  614
              ) | Out-Null

              Start-Sleep -Milliseconds 200

              [MouseAPI]::mouse_event(
                  [MouseAPI]::LEFTDOWN,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Start-Sleep -Milliseconds 100

              [MouseAPI]::mouse_event(
                  [MouseAPI]::LEFTUP,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Log "Mouse click completed"

              # ======================================================
              # SCREENSHOT
              # ======================================================

              Start-Sleep -Milliseconds 500

              Log "Taking screenshot"

              $bounds =
                  [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

              $bitmap =
                  New-Object System.Drawing.Bitmap(
                      $bounds.Width,
                      $bounds.Height
                  )

              $graphics =
                  [System.Drawing.Graphics]::FromImage(
                      $bitmap
                  )

              $graphics.CopyFromScreen(
                  $bounds.X,
                  $bounds.Y,
                  0,
                  0,
                  $bitmap.Size
              )

              $bitmap.Save(
                  $screenshot,
                  [System.Drawing.Imaging.ImageFormat]::Png
              )

              $graphics.Dispose()

              $bitmap.Dispose()

              Log "Screenshot saved"

              # ======================================================
              # WAIT 10 SECONDS AFTER CLICK
              # ======================================================

              Log "Recording 10 seconds after click"

              Start-Sleep -Seconds 10

              # ======================================================
              # CLOSE RED DOT
              # ======================================================

              if ($form) {

                  $form.Close()

                  $form.Dispose()

                  $form = $null
              }

              Log "Red dot closed"

              # ======================================================
              # WAIT FFMPEG
              # ======================================================

              Log "Waiting for FFmpeg"

              $ffmpeg.WaitForExit()

              Log "FFmpeg exit code: $($ffmpeg.ExitCode)"

              # ======================================================
              # COLLECT OUTPUT
              # ======================================================

              $stdout =
                  $stdoutTask.Result

              $stderr =
                  $stderrTask.Result

              Set-Content `
                  -Path $ffmpegOut `
                  -Value $stdout `
                  -Encoding UTF8

              Set-Content `
                  -Path $ffmpegErr `
                  -Value $stderr `
                  -Encoding UTF8

              Log "FFmpeg logs saved"

              # ======================================================
              # VIDEO CHECK
              # ======================================================

              if (-not (Test-Path $video)) {

                  Log "ERROR: Video does not exist"

                  exit 40
              }

              $videoSize =
                  (Get-Item $video).Length

              Log "Video size: $videoSize bytes"

              if ($videoSize -lt 10000) {

                  Log "ERROR: Video is too small"

                  exit 41
              }

              # ======================================================
              # SCREENSHOT CHECK
              # ======================================================

              if (-not (Test-Path $screenshot)) {

                  Log "ERROR: Screenshot does not exist"

                  exit 42
              }

              Log "Screenshot exists"

              # ======================================================
              # FFPROBE
              # ======================================================

              Log "Running ffprobe"

              $probe =
                  & ffprobe `
                    -v error `
                    -show_entries `
                    "format=format_name,duration,size" `
                    -show_entries `
                    "stream=codec_name,width,height,pix_fmt" `
                    -of default=noprint_wrappers=1 `
                    $video 2>&1

              $probeText =
                  $probe -join "`n"

              Log "===== FFPROBE ====="

              Log $probeText

              if ($LASTEXITCODE -ne 0) {

                  Log "ERROR: ffprobe failed"

                  exit 43
              }

              Log "======================================"
              Log "RECORDING SUCCESS"
              Log "======================================"

          }
          catch {

              Log "======================================"
              Log "FATAL ERROR"
              Log "======================================"

              Log $_.Exception.ToString()

              try {

                  if ($form) {

                      $form.Close()

                      $form.Dispose()
                  }
              }
              catch {}

              exit 99
          }
          '@

          Set-Content `
            -Path "C:\temp\RDPClickAndRecord.ps1" `
            -Value $recordingScript `
            -Encoding UTF8

          # ==========================================================
          # CMD LAUNCHER
          # ==========================================================

          $launcher = @'
          @echo off

          echo TASK STARTED > C:\temp\task-started.txt

          echo [%date% %time%] Launcher started >> C:\temp\task-launcher.log

          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe ^
            -NoProfile ^
            -NonInteractive ^
            -ExecutionPolicy Bypass ^
            -File "C:\temp\RDPClickAndRecord.ps1" ^
            >> C:\temp\task-powershell-output.log 2>&1

          echo [%date% %time%] PowerShell exit code: %ERRORLEVEL% >> C:\temp\task-launcher.log

          exit /b %ERRORLEVEL%
          '@

          Set-Content `
            -Path "C:\temp\record-launcher.cmd" `
            -Value $launcher `
            -Encoding ASCII

          Write-Host "=== Recording files created ==="

          Get-ChildItem C:\temp |
            Select-Object Name,Length |
            Format-Table -AutoSize


      # ============================================================
      # 9. VALIDATE RECORDING SCRIPT BEFORE TASK
      # ============================================================
      - name: Validate recording script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Testing PowerShell parser ==="

          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
            "C:\temp\RDPClickAndRecord.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {

              Write-Host "PARSER ERRORS:"
              $errors | Format-List *

              throw "RDPClickAndRecord.ps1 contains PowerShell syntax errors."
          }

          Write-Host "PowerShell parser: OK"

          Write-Host ""
          Write-Host "=== Checking here-string endings ==="

          Select-String `
            -Path "C:\temp\RDPClickAndRecord.ps1" `
            -Pattern '^"@$' |
            ForEach-Object {
              Write-Host "Valid here-string terminator at line $($_.LineNumber)"
            }

          Write-Host ""
          Write-Host "Script validation successful."


      # ============================================================
      # 10. CREATE RECORDING TASK
      # ============================================================
      - name: Create recording task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Active session ==="

          quser

          Write-Host ""
          Write-Host "=== Removing old recording task ==="

          & schtasks.exe /delete `
            /tn "RDPClickAndRecord" `
            /f

          if ($LASTEXITCODE -ne 0) {

            Write-Host "Old recording task does not exist."
          }

          Write-Host ""
          Write-Host "=== Creating recording task ==="

          & schtasks.exe /create `
            /tn "RDPClickAndRecord" `
            /tr "C:\temp\record-launcher.cmd" `
            /sc ONLOGON `
            /ru runneradmin `
            /rp "WindowsRDP#2025" `
            /it `
            /f

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create recording task"
          }

          schtasks.exe /query `
            /tn "RDPClickAndRecord" `
            /v `
            /fo LIST


      # ============================================================
      # 11. START RECORDING
      # ============================================================
      - name: Start recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            "C:\temp\task-started.txt",
            "C:\temp\task-launcher.log",
            "C:\temp\task-powershell-output.log",
            "C:\temp\click-record.log",
            "C:\temp\rdp-click-video.mp4",
            "C:\temp\rdp-click-screenshot.png" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Starting recording task..."

          & schtasks.exe /run `
            /tn "RDPClickAndRecord"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start recording task"
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=== Recording task status ==="

          schtasks.exe /query `
            /tn "RDPClickAndRecord" `
            /v `
            /fo LIST


      # ============================================================
      # 12. WAIT
      # ============================================================
      - name: Wait for recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $video =
            "C:\temp\rdp-click-video.mp4"

          $screenshot =
            "C:\temp\rdp-click-screenshot.png"

          $taskStarted =
            "C:\temp\task-started.txt"

          $recordLog =
            "C:\temp\click-record.log"

          $launcherLog =
            "C:\temp\task-launcher.log"

          $powershellLog =
            "C:\temp\task-powershell-output.log"

          Write-Host "Waiting for recording..."

          $finished = $false

          for ($i = 1; $i -le 120; $i++) {

            if (($i % 5) -eq 0) {
              Write-Host "Waiting... $i / 120"
            }

            if (
              (Test-Path $video) -and
              (Test-Path $screenshot)
            ) {

              $size =
                (Get-Item $video).Length

              if ($size -gt 10000) {

                $finished = $true

                Write-Host "Recording files detected."

                break
              }
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TASK STATUS"
          Write-Host "=========================================="

          schtasks.exe /query `
            /tn "RDPClickAndRecord" `
            /v `
            /fo LIST

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TASK STARTED"
          Write-Host "=========================================="

          if (Test-Path $taskStarted) {
            Get-Content $taskStarted
          }
          else {
            Write-Host "TASK STARTED FILE NOT FOUND"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LAUNCHER LOG"
          Write-Host "=========================================="

          if (Test-Path $launcherLog) {
            Get-Content $launcherLog
          }
          else {
            Write-Host "Launcher log not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "POWERSHELL OUTPUT"
          Write-Host "=========================================="

          if (Test-Path $powershellLog) {
            Get-Content $powershellLog
          }
          else {
            Write-Host "PowerShell output not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RECORDING LOG"
          Write-Host "=========================================="

          if (Test-Path $recordLog) {
            Get-Content $recordLog
          }
          else {
            Write-Host "Recording log not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FFMPEG ERROR"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\ffmpeg-error.log") {
            Get-Content "C:\temp\ffmpeg-error.log"
          }
          else {
            Write-Host "FFmpeg error log not found."
          }

          if (-not $finished) {

            throw "Recording did not finish."
          }

          Write-Host "Recording completed successfully."


      # ============================================================
      # 13. VERIFY VIDEO
      # ============================================================
      - name: Verify video
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $video =
            "C:\temp\rdp-click-video.mp4"

          if (-not (Test-Path $video)) {
            throw "Video not found"
          }

          $size =
            (Get-Item $video).Length

          Write-Host "Video size: $size bytes"

          if ($size -lt 10000) {
            throw "Video is too small"
          }

          Write-Host ""
          Write-Host "=== FFPROBE ==="

          ffprobe `
            -v error `
            -show_entries `
            "format=format_name,duration,size" `
            -show_entries `
            "stream=codec_name,width,height,pix_fmt" `
            -of default=noprint_wrappers=1 `
            $video


      # ============================================================
      # 14. UPLOAD SCREENSHOT
      # ============================================================
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-screenshot
          path: C:\temp\rdp-click-screenshot.png
          if-no-files-found: ignore


      # ============================================================
      # 15. UPLOAD VIDEO
      # ============================================================
      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-video
          path: C:\temp\rdp-click-video.mp4
          if-no-files-found: ignore


      # ============================================================
      # 16. DEBUG ARTIFACT
      # ============================================================
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-record-debug
          path: |
            C:\temp\task-started.txt
            C:\temp\task-launcher.log
            C:\temp\task-powershell-output.log
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
          if-no-files-found: ignore
