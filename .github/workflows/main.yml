name: Pure RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:

      # ============================================================
      # 1. CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $password = "WindowsRDP#2025"
          $username = "runneradmin"

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($user) {

              Write-Host "User already exists."

              net user $username $password

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update password."
              }

          }
          else {

              net user $username $password /add

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create user."
              }
          }

          $isAdmin = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -match "\\$username$"
            }

          if (-not $isAdmin) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $username
          }

          "RDP_USER=$username" |
            Out-File $env:GITHUB_ENV -Append

          "RDP_PASS=$password" |
            Out-File $env:GITHUB_ENV -Append

      # ============================================================
      # 2. INSTALL CHROME
      # ============================================================
      - name: Install Google Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $chrome64 = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          $chrome32 = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"

          if (Test-Path $chrome64) {
              $chrome = $chrome64
          }
          elseif (Test-Path $chrome32) {
              $chrome = $chrome32
          }
          else {

              $installer = "$env:TEMP\chrome_installer.exe"

              Invoke-WebRequest `
                -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
                -OutFile $installer

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/silent", "/install" `
                -Wait `
                -NoNewWindow

              Remove-Item `
                $installer `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 5

              if (Test-Path $chrome64) {
                  $chrome = $chrome64
              }
              elseif (Test-Path $chrome32) {
                  $chrome = $chrome32
              }
              else {
                  throw "Chrome installation failed."
              }
          }

          "CHROME_PATH=$chrome" |
            Out-File $env:GITHUB_ENV -Append

      # ============================================================
      # 3. CREATE CHROME SCRIPT
      # ============================================================
      - name: Create Chrome Script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          $scriptPath = "C:\temp\OpenChrome.ps1"

          $chromeScript = @'
          $ErrorActionPreference = "Stop"

          Start-Sleep -Seconds 5

          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"

          if (-not (Test-Path $chrome)) {
              $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          }

          if (-not (Test-Path $chrome)) {
              throw "Chrome executable not found."
          }

          $chromeArguments = @(
              "--no-first-run"
              "--no-default-browser-check"
              "--disable-features=WelcomeToChrome"
              "--start-maximized"
              "https://github.com"
          )

          Start-Process `
            -FilePath $chrome `
            -ArgumentList $chromeArguments

          Write-Host "Chrome launched."
          '@

          Set-Content `
            -Path $scriptPath `
            -Value $chromeScript `
            -Encoding UTF8

      # ============================================================
      # 4. CREATE CHROME TASK
      # ============================================================
      - name: Create Chrome Scheduled Task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $taskName = "OpenChromeAutomatically"

          cmd.exe /c "schtasks /query /tn `"$taskName`" >nul 2>&1"

          if ($LASTEXITCODE -eq 0) {
              cmd.exe /c "schtasks /delete /tn `"$taskName`" /f >nul 2>&1"
          }

          $createArguments = @(
              "/create"
              "/tn"
              $taskName
              "/tr"
              'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\temp\OpenChrome.ps1'
              "/sc"
              "ONLOGON"
              "/ru"
              "runneradmin"
              "/rp"
              "WindowsRDP#2025"
              "/it"
              "/f"
          )

          & schtasks.exe @createArguments

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create Chrome task."
          }

      # ============================================================
      # 5. TAILSCALE
      # ============================================================
      - name: Install and Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -NoNewWindow

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale executable not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY is missing."
          }

          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="github-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {

              $ip = & $tailscale ip -4 2>$null

              if ($ip) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $ip) {
              throw "Tailscale IPv4 not found."
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Tailscale IP: $ip"

      # ============================================================
      # 6. RDP CREDENTIALS
      # ============================================================
      - name: Prepare Automatic RDP Login
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          cmdkey `
            /generic:TERMSRV/127.0.0.1 `
            /user:runneradmin `
            /pass:WindowsRDP#2025

          cmdkey `
            /generic:TERMSRV/localhost `
            /user:runneradmin `
            /pass:WindowsRDP#2025

      # ============================================================
      # 7. START RDP
      # ============================================================
      - name: Start Automatic RDP Session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $regPath = "HKCU:\Software\Microsoft\Terminal Server Client"

          if (!(Test-Path $regPath)) {
              New-Item `
                -Path $regPath `
                -Force |
                Out-Null
          }

          Set-ItemProperty `
            -Path $regPath `
            -Name "AuthenticationLevelOverride" `
            -Value 0 `
            -Type DWord `
            -Force

          $mstsc = "$env:SystemRoot\System32\mstsc.exe"

          $process = Start-Process `
            -FilePath $mstsc `
            -ArgumentList "/v:127.0.0.1 /f" `
            -PassThru

          Write-Host "RDP client started."
          Write-Host "PID: $($process.Id)"

          Start-Sleep -Seconds 100

          Write-Host "Current sessions:"
          quser

      # ============================================================
      # 8. START CHROME
      # ============================================================
      - name: Launch Chrome In RDP Session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          quser

          & schtasks.exe `
            /run `
            /tn "OpenChromeAutomatically"

          if ($LASTEXITCODE -ne 0) {
              throw "Could not start Chrome scheduled task."
          }

          Write-Host "Chrome scheduled task started."

      # ============================================================
      # 9. WAIT FOR CHROME
      # ============================================================
      - name: Wait For Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $found = $false

          for ($i = 1; $i -le 60; $i++) {

              $chrome = Get-Process `
                -Name "chrome" `
                -ErrorAction SilentlyContinue

              if ($chrome) {

                  Write-Host "Chrome process detected."

                  $found = $true
                  break
              }

              Write-Host "Chrome not detected yet: $i / 60"

              Start-Sleep -Seconds 2
          }

          if (-not $found) {
              throw "Chrome was not detected."
          }

      # ============================================================
      # 10. WAIT FOR WEBSITE
      # ============================================================
      - name: Wait 100 Seconds For Website
        shell: powershell
        run: |
          Write-Host "Waiting 100 seconds for Chrome and website..."

          Start-Sleep -Seconds 100

      # ============================================================
      # 11. INSTALL FFMPEG
      # ============================================================
      - name: Install FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ffmpegDir = "C:\ffmpeg"
          $zipPath = "$env:TEMP\ffmpeg.zip"

          if (-not (Test-Path "$ffmpegDir\bin\ffmpeg.exe")) {

              Invoke-WebRequest `
                -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
                -OutFile $zipPath

              $extractDir = "$env:TEMP\ffmpeg_extract"

              Remove-Item `
                $extractDir `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              Expand-Archive `
                -Path $zipPath `
                -DestinationPath $extractDir `
                -Force

              $ffmpegExe = Get-ChildItem `
                -Path $extractDir `
                -Filter "ffmpeg.exe" `
                -Recurse |
                Select-Object -First 1

              if (-not $ffmpegExe) {
                  throw "ffmpeg.exe not found."
              }

              New-Item `
                -ItemType Directory `
                -Path "$ffmpegDir\bin" `
                -Force |
                Out-Null

              Copy-Item `
                -Path "$($ffmpegExe.Directory.FullName)\*" `
                -Destination "$ffmpegDir\bin" `
                -Recurse `
                -Force
          }

          if (-not (Test-Path "$ffmpegDir\bin\ffmpeg.exe")) {
              throw "FFmpeg installation failed."
          }

          & "$ffmpegDir\bin\ffmpeg.exe" -version |
            Select-Object -First 1

      # ============================================================
      # 12. CREATE RECORDING SCRIPT
      # ============================================================
      - name: Create Click And Record Script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = "C:\temp\ClickAndRecord.ps1"

          $script = @'
          $ErrorActionPreference = "Stop"

          $log = "C:\temp\click-record.log"

          function Log($text) {
              $timestamp = Get-Date -Format "HH:mm:ss.fff"
              "$timestamp $text" |
                Tee-Object -FilePath $log -Append
          }

          try {

              Log "SCRIPT STARTED"

              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing

              Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class MouseAPI
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(int X, int Y);

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint dwFlags,
                  uint dx,
                  uint dy,
                  uint dwData,
                  UIntPtr dwExtraInfo
              );

              public const uint LEFTDOWN = 0x0002;
              public const uint LEFTUP = 0x0004;
          }
          "@

              $x = 84
              $y = 614

              $ffmpeg = "C:\ffmpeg\bin\ffmpeg.exe"

              $videoOutput = "C:\temp\rdp-click-video.mp4"
              $screenshotOutput = "C:\temp\rdp-click-screenshot.png"

              Log "Checking FFmpeg."

              if (-not (Test-Path $ffmpeg)) {
                  throw "FFmpeg not found."
              }

              Log "FFmpeg found."

              # ----------------------------------------------------
              # MINIMIZE KNOWN WINDOWS
              # ----------------------------------------------------

              Log "Minimizing non-Chrome applications."

              $appsToMinimize = @(
                  "explorer",
                  "notepad",
                  "powershell",
                  "pwsh",
                  "cmd",
                  "WindowsTerminal",
                  "Taskmgr",
                  "mmc",
                  "SystemSettings",
                  "ApplicationFrameHost"
              )

              foreach ($name in $appsToMinimize) {

                  try {

                      $processes = Get-Process `
                        -Name $name `
                        -ErrorAction SilentlyContinue

                      foreach ($p in $processes) {

                          if ($p.MainWindowHandle -ne [IntPtr]::Zero) {

                              Log "Minimizing $name PID=$($p.Id)"

                              Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class WindowMinAPI
          {
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              public const int SW_MINIMIZE = 6;
          }
          "@

                              [WindowMinAPI]::ShowWindow(
                                  $p.MainWindowHandle,
                                  [WindowMinAPI]::SW_MINIMIZE
                              ) | Out-Null
                          }
                      }
                  }
                  catch {
                      Log "Could not minimize $name"
                  }
              }

              Log "Non-Chrome applications minimized."

              # ----------------------------------------------------
              # CHROME
              # ----------------------------------------------------

              $chrome = Get-Process `
                -Name "chrome" `
                -ErrorAction SilentlyContinue

              if (-not $chrome) {
                  throw "Chrome process not found."
              }

              Log "Chrome detected."

              $chromeWindow = $null

              foreach ($p in $chrome) {

                  if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
                      $chromeWindow = $p.MainWindowHandle
                      break
                  }
              }

              if ($chromeWindow) {

                  Log "Chrome window found."

                  [WindowMinAPI]::ShowWindow(
                      $chromeWindow,
                      9
                  ) | Out-Null

                  Start-Sleep -Milliseconds 500

                  [WindowMinAPI]::SetForegroundWindow(
                      $chromeWindow
                  ) | Out-Null
              }

              Start-Sleep -Seconds 2

              # ----------------------------------------------------
              # SCREEN
              # ----------------------------------------------------

              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen

              Log "Screen: $($screen.Width)x$($screen.Height)"

              # ----------------------------------------------------
              # RED DOT
              # ----------------------------------------------------

              $form = New-Object System.Windows.Forms.Form

              $form.FormBorderStyle = "None"
              $form.StartPosition = "Manual"
              $form.ShowInTaskbar = $false
              $form.TopMost = $true
              $form.BackColor = [System.Drawing.Color]::Red

              $form.Width = 10
              $form.Height = 10

              $form.Left = $x - 5
              $form.Top = $y - 5

              $form.Show()
              $form.Refresh()

              Log "Red dot created."

              Remove-Item `
                $videoOutput `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $screenshotOutput `
                -Force `
                -ErrorAction SilentlyContinue

              # ----------------------------------------------------
              # FFMPEG
              # ----------------------------------------------------

              Log "Starting FFmpeg."

              $arguments = @(
                  "-y"
                  "-f"
                  "gdigrab"
                  "-framerate"
                  "10"
                  "-draw_mouse"
                  "1"
                  "-i"
                  "desktop"
                  "-t"
                  "15"
                  "-c:v"
                  "libx264"
                  "-preset"
                  "ultrafast"
                  "-pix_fmt"
                  "yuv420p"
                  "-movflags"
                  "+faststart"
                  $videoOutput
              )

              $ffmpegProcess = Start-Process `
                -FilePath $ffmpeg `
                -ArgumentList $arguments `
                -PassThru `
                -NoNewWindow

              Log "FFmpeg started PID=$($ffmpegProcess.Id)"

              # ----------------------------------------------------
              # BEFORE CLICK
              # ----------------------------------------------------

              Log "Waiting 5 seconds."

              Start-Sleep -Seconds 5

              # ----------------------------------------------------
              # CLICK
              # ----------------------------------------------------

              Log "Moving mouse to $x,$y."

              [MouseAPI]::SetCursorPos(
                  $x,
                  $y
              ) | Out-Null

              Start-Sleep -Milliseconds 300

              Log "CLICK."

              [MouseAPI]::mouse_event(
                  [MouseAPI]::LEFTDOWN,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Start-Sleep -Milliseconds 100

              [MouseAPI]::mouse_event(
                  [MouseAPI]::LEFTUP,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Log "CLICK COMPLETED."

              # ----------------------------------------------------
              # SCREENSHOT
              # ----------------------------------------------------

              Start-Sleep -Milliseconds 500

              Log "Creating screenshot."

              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen

              $bitmap = New-Object `
                System.Drawing.Bitmap `
                $screen.Width, `
                $screen.Height

              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

              $graphics.CopyFromScreen(
                  $screen.Left,
                  $screen.Top,
                  0,
                  0,
                  $screen.Size
              )

              $bitmap.Save(
                  $screenshotOutput,
                  [System.Drawing.Imaging.ImageFormat]::Png
              )

              $graphics.Dispose()
              $bitmap.Dispose()

              Log "Screenshot created."

              # ----------------------------------------------------
              # AFTER CLICK
              # ----------------------------------------------------

              Log "Waiting 10 seconds."

              Start-Sleep -Seconds 10

              # ----------------------------------------------------
              # FFMPEG
              # ----------------------------------------------------

              Log "Waiting for FFmpeg."

              $ffmpegProcess.WaitForExit()

              Log "FFmpeg exited with code $($ffmpegProcess.ExitCode)."

              if ($ffmpegProcess.ExitCode -ne 0) {
                  throw "FFmpeg failed."
              }

              # ----------------------------------------------------
              # CLOSE DOT
              # ----------------------------------------------------

              $form.Close()
              $form.Dispose()

              Log "Red dot closed."

              # ----------------------------------------------------
              # VERIFY
              # ----------------------------------------------------

              if (-not (Test-Path $videoOutput)) {
                  throw "Video was not created."
              }

              if (-not (Test-Path $screenshotOutput)) {
                  throw "Screenshot was not created."
              }

              $videoSize = (Get-Item $videoOutput).Length
              $screenshotSize = (Get-Item $screenshotOutput).Length

              Log "Video size=$videoSize"
              Log "Screenshot size=$screenshotSize"

              if ($videoSize -lt 10000) {
                  throw "Video is too small."
              }

              if ($screenshotSize -lt 1000) {
                  throw "Screenshot is too small."
              }

              Log "SCRIPT COMPLETED SUCCESSFULLY."

          }
          catch {

              Log "ERROR: $($_.Exception.Message)"

              try {
                  if ($form) {
                      $form.Close()
                      $form.Dispose()
                  }
              }
              catch {
              }

              exit 1
          }
          '@

          Set-Content `
            -Path $scriptPath `
            -Value $script `
            -Encoding UTF8

          Write-Host "Recording script created."

      # ============================================================
      # 13. CREATE RECORDING TASK
      # ============================================================
      - name: Create Recording Scheduled Task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $taskName = "RDPClickAndRecord"

          cmd.exe /c "schtasks /query /tn `"$taskName`" >nul 2>&1"

          if ($LASTEXITCODE -eq 0) {

              cmd.exe /c "schtasks /delete /tn `"$taskName`" /f >nul 2>&1"
          }

          $createArguments = @(
              "/create"
              "/tn"
              $taskName
              "/tr"
              'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\temp\ClickAndRecord.ps1'
              "/sc"
              "ONCE"
              "/st"
              "00:00"
              "/sd"
              "01/01/2030"
              "/ru"
              "runneradmin"
              "/rp"
              "WindowsRDP#2025"
              "/it"
              "/f"
          )

          & schtasks.exe @createArguments

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create recording task."
          }

      # ============================================================
      # 14. START RECORDING
      # ============================================================
      - name: Start Click And Recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            "C:\temp\click-record.log" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "C:\temp\rdp-click-video.mp4" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "C:\temp\rdp-click-screenshot.png" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Starting recording task..."

          & schtasks.exe `
            /run `
            /tn "RDPClickAndRecord"

          if ($LASTEXITCODE -ne 0) {
              throw "Could not start recording task."
          }

          Write-Host "Recording task started."

      # ============================================================
      # 15. WAIT + SHOW TASK STATUS
      # ============================================================
      - name: Wait For Recording Completion
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $video = "C:\temp\rdp-click-video.mp4"
          $screenshot = "C:\temp\rdp-click-screenshot.png"
          $log = "C:\temp\click-record.log"

          $finished = $false

          for ($i = 1; $i -le 90; $i++) {

              Write-Host "Waiting... $i / 90"

              if (Test-Path $log) {

                  Write-Host "--- Recording log ---"

                  Get-Content `
                    $log `
                    -Tail 10 `
                    -ErrorAction SilentlyContinue

                  Write-Host "---------------------"
              }

              if (
                  (Test-Path $video) -and
                  (Test-Path $screenshot)
              ) {

                  $videoSize = (Get-Item $video).Length

                  if ($videoSize -gt 10000) {

                      $finished = $true

                      Write-Host "Recording files detected."

                      break
                  }
              }

              Start-Sleep -Seconds 1
          }

          if (-not $finished) {

              Write-Host ""
              Write-Host "============================================"
              Write-Host "RECORDING TASK FAILED OR DID NOT FINISH"
              Write-Host "============================================"

              Write-Host ""
              Write-Host "TASK STATUS:"

              schtasks.exe `
                /query `
                /tn "RDPClickAndRecord" `
                /fo LIST `
                /v

              Write-Host ""
              Write-Host "RECORDING LOG:"

              if (Test-Path $log) {
                  Get-Content $log
              }
              else {
                  Write-Host "No recording log was created."
              }

              Write-Host ""
              Write-Host "FILES:"

              Get-ChildItem `
                "C:\temp" `
                -ErrorAction SilentlyContinue |
                Select-Object Name,Length,LastWriteTime

              throw "Recording did not finish."
          }

          Write-Host ""
          Write-Host "Recording completed successfully."

      # ============================================================
      # 16. VERIFY VIDEO
      # ============================================================
      - name: Verify Video
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $video = "C:\temp\rdp-click-video.mp4"
          $ffprobe = "C:\ffmpeg\bin\ffprobe.exe"

          if (-not (Test-Path $video)) {
              throw "Video file not found."
          }

          Write-Host "Video size:"
          Write-Host (Get-Item $video).Length

          if (Test-Path $ffprobe) {

              Write-Host ""
              Write-Host "FFprobe result:"

              & $ffprobe `
                -v error `
                -show_entries format=format_name,duration,size `
                -show_entries stream=codec_name,width,height,r_frame_rate `
                -of default=noprint_wrappers=1 `
                $video

              if ($LASTEXITCODE -ne 0) {
                  throw "Video verification failed."
              }
          }

      # ============================================================
      # 17. COPY FILES
      # ============================================================
      - name: Copy Recording Files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Copy-Item `
            "C:\temp\rdp-click-video.mp4" `
            "$env:GITHUB_WORKSPACE\rdp-click-video.mp4" `
            -Force

          Copy-Item `
            "C:\temp\rdp-click-screenshot.png" `
            "$env:GITHUB_WORKSPACE\rdp-click-screenshot.png" `
            -Force

      # ============================================================
      # 18. UPLOAD SCREENSHOT
      # ============================================================
      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-screenshot
          path: ${{ github.workspace }}/rdp-click-screenshot.png
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 19. UPLOAD VIDEO
      # ============================================================
      - name: Upload Click Recording Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-video
          path: ${{ github.workspace }}/rdp-click-video.mp4
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 20. FINAL
      # ============================================================
      - name: Display Final Information
        shell: powershell
