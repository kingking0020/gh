name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      RDP_USERNAME: runneradmin

      # ------------------------------------------------------------
      # RDP PASSWORD
      # ------------------------------------------------------------
      # این مقدار را با پسورد خودت عوض کن.
      RDP_PASSWORD: "RdpAccess#2026X"

      # ------------------------------------------------------------
      # CLICK COORDINATES
      # ------------------------------------------------------------
      CLICK_X: "84"
      CLICK_Y: "614"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # RUNNER INFORMATION
      # ============================================================

      - name: Show runner information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "RUNNER INFORMATION"
          Write-Host "=========================================="

          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable

      # ============================================================
      # RDP LOGIN
      # ============================================================

      - name: Show RDP login
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RDP LOGIN"
          Write-Host "=========================================="

          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host "=========================================="

      # ============================================================
      # CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CONFIGURING RDP"
          Write-Host "=========================================="

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($username)) {
              throw "RDP_USERNAME is empty."
          }

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD is empty."
          }

          Write-Host "Username: $username"
          Write-Host "Password: $password"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # ==========================================================
          # CREATE / UPDATE USER
          # ==========================================================

          $existingUser =
            Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($null -ne $existingUser) {

              Write-Host ""
              Write-Host "User already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword `
                -ErrorAction Stop

              try {
                  Set-LocalUser `
                    -Name $username `
                    -PasswordNeverExpires $true `
                    -ErrorAction Stop
              }
              catch {
                  Write-Host "PasswordNeverExpires update skipped."
              }

              Write-Host "Password updated successfully."

          }
          else {

              Write-Host ""
              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Actions RDP account" `
                -ErrorAction Stop

              Write-Host "User created successfully."
          }

          # ==========================================================
          # ADMINISTRATORS
          # ==========================================================

          Write-Host ""
          Write-Host "Checking Administrators membership..."

          $adminMember =
            Get-LocalGroupMember `
              -Group "Administrators" `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $adminMember) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $username `
                -ErrorAction Stop

              Write-Host "Added to Administrators."

          }
          else {

              Write-Host "Already in Administrators."
          }

          # ==========================================================
          # REMOTE DESKTOP USERS
          # ==========================================================

          Write-Host ""
          Write-Host "Checking Remote Desktop Users membership..."

          $rdpMember =
            Get-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $rdpMember) {

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $username `
                -ErrorAction Stop

              Write-Host "Added to Remote Desktop Users."

          }
          else {

              Write-Host "Already in Remote Desktop Users."
          }

          # ==========================================================
          # ENABLE RDP
          # ==========================================================

          Write-Host ""
          Write-Host "Enabling RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # ==========================================================
          # ENABLE NLA
          # ==========================================================

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # ==========================================================
          # FIREWALL
          # ==========================================================

          Write-Host ""
          Write-Host "Enabling Remote Desktop firewall..."

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule `
            -ErrorAction SilentlyContinue

          # ==========================================================
          # TERMSERVICE
          # ==========================================================

          Write-Host ""
          Write-Host "Configuring TermService..."

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic `
            -ErrorAction Stop

          $termService =
            Get-Service `
              -Name "TermService"

          if ($termService.Status -eq "Running") {

              Restart-Service `
                -Name "TermService" `
                -Force `
                -ErrorAction Stop

          }
          else {

              Start-Service `
                -Name "TermService" `
                -ErrorAction Stop
          }

          Start-Sleep -Seconds 4

          $termService =
            Get-Service `
              -Name "TermService"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP SERVICE"
          Write-Host "=========================================="

          $termService |
            Format-Table Name, Status, StartType -AutoSize

          if ($termService.Status -ne "Running") {
              throw "TermService is not running."
          }

          Write-Host ""
          Write-Host "RDP configured successfully."

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "TAILSCALE"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY is empty."
          }

          $tailscaleExe =
            "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {

              $installer =
                "$env:TEMP\tailscale-setup.exe"

              Write-Host "Downloading Tailscale..."

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                -OutFile $installer

              Write-Host "Installing Tailscale..."

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/quiet" `
                -Wait

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable not found."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscaleExe up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp-3" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=== TAILSCALE STATUS ==="

          & $tailscaleExe status

          Write-Host ""
          Write-Host "=== TAILSCALE IPV4 ==="

          $tailscaleIP =
            (& $tailscaleExe ip -4 | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
              throw "Could not obtain Tailscale IPv4."
          }

          Write-Host $tailscaleIP

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME
      # ============================================================

      - name: Check and install Chrome
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHROME"
          Write-Host "=========================================="

          $paths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromePath = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {
                  $chromePath = $path
                  break
              }
          }

          if (-not $chromePath) {

              Write-Host "Chrome not found."
              Write-Host "Installing Chrome..."

              choco install googlechrome -y --no-progress

              Start-Sleep -Seconds 6

              foreach ($path in $paths) {

                  if (Test-Path $path) {
                      $chromePath = $path
                      break
                  }
              }
          }

          if (-not $chromePath) {
              throw "Chrome executable was not found."
          }

          Write-Host "Chrome:"
          Write-Host $chromePath

          "CHROME_PATH=$chromePath" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME POLICY
      # ============================================================

      - name: Configure Chrome policies
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $policyPath =
            "HKLM:\Software\Policies\Google\Chrome"

          if (-not (Test-Path $policyPath)) {

              New-Item `
                -Path $policyPath `
                -Force |
                Out-Null
          }

          New-ItemProperty `
            -Path $policyPath `
            -Name "BrowserSignin" `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $policyPath `
            -Name "SyncDisabled" `
            -PropertyType DWord `
            -Value 1 `
            -Force |
            Out-Null

          Write-Host "Chrome policies configured."

      # ============================================================
      # PREPARE CHROME PROFILE
      # ============================================================

      - name: Prepare Chrome profile
        shell: powershell
        run: |

          $chromeProfile =
            "C:\temp\ChromeProfile"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Remove-Item `
            $chromeProfile `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $chromeProfile `
            -Force |
            Out-Null

          Write-Host "Chrome profile ready."

      # ============================================================
      # RDP INFORMATION
      # ============================================================

      - name: Show RDP connection information
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "RDP CONNECTION"
          Write-Host "=========================================="

          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "Port:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "Click X:"
          Write-Host $env:CLICK_X

          Write-Host "Click Y:"
          Write-Host $env:CLICK_Y

          Write-Host "=========================================="

      # ============================================================
      # VERIFY INTERACTIVE DESKTOP
      # ============================================================

      - name: Verify interactive desktop
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING DESKTOP"
          Write-Host "=========================================="

          Write-Host "USERNAME:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "SESSIONNAME:"
          Write-Host $env:SESSIONNAME

          Write-Host ""
          Write-Host "QWINSTA:"

          try {
              qwinsta
          }
          catch {
              Write-Host $_.Exception.Message
          }

          Add-Type -AssemblyName System.Windows.Forms

          $screen =
            [System.Windows.Forms.Screen]::PrimaryScreen

          if ($null -eq $screen) {
              throw "PrimaryScreen is null."
          }

          Write-Host ""
          Write-Host "SCREEN:"
          Write-Host "X=$($screen.Bounds.X)"
          Write-Host "Y=$($screen.Bounds.Y)"
          Write-Host "Width=$($screen.Bounds.Width)"
          Write-Host "Height=$($screen.Bounds.Height)"

      # ============================================================
      # MINIMIZE EVERYTHING
      # ============================================================

      - name: Minimize all windows
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "MINIMIZING ALL WINDOWS"
          Write-Host "=========================================="

          try {

              $shell =
                New-Object -ComObject Shell.Application

              $shell.MinimizeAll()

              Write-Host "All windows minimized successfully."

          }
          catch {

              Write-Host "Shell MinimizeAll failed."
              Write-Host $_.Exception.Message

              # ------------------------------------------------------
              # Win+D fallback
              # ------------------------------------------------------

              Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class DesktopShortcut
          {
              [DllImport("user32.dll")]
              public static extern void keybd_event(
                  byte bVk,
                  byte bScan,
                  uint dwFlags,
                  UIntPtr dwExtraInfo
              );

              public const uint KEYEVENTF_KEYUP = 0x0002;

              public const byte VK_LWIN = 0x5B;
              public const byte VK_D = 0x44;
          }
          "@

              [DesktopShortcut]::keybd_event(
                  [DesktopShortcut]::VK_LWIN,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              [DesktopShortcut]::keybd_event(
                  [DesktopShortcut]::VK_D,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              [DesktopShortcut]::keybd_event(
                  [DesktopShortcut]::VK_D,
                  0,
                  [DesktopShortcut]::KEYEVENTF_KEYUP,
                  [UIntPtr]::Zero
              )

              [DesktopShortcut]::keybd_event(
                  [DesktopShortcut]::VK_LWIN,
                  0,
                  [DesktopShortcut]::KEYEVENTF_KEYUP,
                  [UIntPtr]::Zero
              )

              Write-Host "Win+D fallback executed."
          }

          Start-Sleep -Seconds 2

          Write-Host "Desktop prepared."

      # ============================================================
      # START CHROME MAXIMIZED
      # ============================================================

      - name: Start Chrome maximized
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "STARTING CHROME"
          Write-Host "=========================================="

          $chromePath =
            $env:CHROME_PATH

          if ([string]::IsNullOrWhiteSpace($chromePath)) {
              throw "CHROME_PATH is empty."
          }

          if (-not (Test-Path $chromePath)) {
              throw "Chrome executable does not exist."
          }

          $chromeProfile =
            "C:\temp\ChromeProfile"

          $arguments = @(
            "--no-first-run"
            "--no-default-browser-check"
            "--disable-session-crashed-bubble"
            "--disable-features=Translate"
            "--start-maximized"
            "--new-window"
            "--user-data-dir=$chromeProfile"

            # ------------------------------------------------------
            # URL را اینجا تغییر بده
            # ------------------------------------------------------
            "https://github.com"
          )

          Write-Host ""
          Write-Host "Opening URL:"
          Write-Host "https://github.com"

          $chromeProcess =
            Start-Process `
              -FilePath $chromePath `
              -ArgumentList $arguments `
              -PassThru

          if ($null -eq $chromeProcess) {
              throw "Chrome failed to start."
          }

          Write-Host "Chrome PID: $($chromeProcess.Id)"

          Start-Sleep -Seconds 8

          # ==========================================================
          # CHROME WINDOW
          # ==========================================================

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class ChromeWindow
          {
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(
                  IntPtr hWnd
              );

              public const int SW_MAXIMIZE = 3;
          }
          "@

          $chromeWindow =
            Get-Process chrome `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.MainWindowHandle -ne 0
            } |
            Sort-Object StartTime -Descending |
            Select-Object -First 1

          if ($null -eq $chromeWindow) {
              throw "Chrome window was not found."
          }

          Write-Host ""
          Write-Host "Chrome HWND:"
          Write-Host $chromeWindow.MainWindowHandle

          [ChromeWindow]::ShowWindow(
              $chromeWindow.MainWindowHandle,
              [ChromeWindow]::SW_MAXIMIZE
          ) | Out-Null

          Start-Sleep -Milliseconds 800

          [ChromeWindow]::SetForegroundWindow(
              $chromeWindow.MainWindowHandle
          ) | Out-Null

          Start-Sleep -Seconds 2

          $chromeWindow.Refresh()

          Write-Host ""
          Write-Host "Chrome title:"
          Write-Host $chromeWindow.MainWindowTitle

          Write-Host ""
          Write-Host "Chrome is maximized and in foreground."

      # ============================================================
      # INSTALL FFMPEG
      # ============================================================

      - name: Install FFmpeg
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FFMPEG"
          Write-Host "=========================================="

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {

              Write-Host "Installing FFmpeg..."

              choco install ffmpeg -y --no-progress

              Start-Sleep -Seconds 5
          }

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {
              throw "FFmpeg was not found."
          }

          Write-Host "FFmpeg:"
          Write-Host $ffmpeg.Source

          $ffprobe =
            Get-Command ffprobe.exe `
              -ErrorAction SilentlyContinue

          if ($ffprobe) {

              Write-Host ""
              Write-Host "FFprobe:"
              Write-Host $ffprobe.Source
          }

      # ============================================================
      # CREATE RECORDING SCRIPT
      # ============================================================

      - name: Create recording script
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING RECORDING SCRIPT"
          Write-Host "=========================================="

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          $recordingScript = @'
          $ErrorActionPreference = "Stop"

          $logFile =
              "C:\temp\click-record.log"

          $videoFile =
              "C:\temp\rdp-click-video.mp4"

          $screenshotFile =
              "C:\temp\rdp-click-screenshot.png"

          $ffmpegOutput =
              "C:\temp\ffmpeg-output.log"

          $ffmpegError =
              "C:\temp\ffmpeg-error.log"

          function Log($text) {

              $line =
                  "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff')  $text"

              Write-Host $line

              Add-Content `
                -Path $logFile `
                -Value $line
          }

          # ==========================================================
          # WIN32 MOUSE API
          # ==========================================================

          Add-Type @"

          using System;
          using System.Runtime.InteropServices;

          public static class NativeMouse
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(
                  int X,
                  int Y
              );

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint dwFlags,
                  uint dx,
                  uint dy,
                  uint dwData,
                  UIntPtr dwExtraInfo
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(
                  IntPtr hWnd
              );

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              public const uint MOUSEEVENTF_LEFTDOWN = 0x0002;
              public const uint MOUSEEVENTF_LEFTUP   = 0x0004;

              public const int SW_RESTORE = 9;
              public const int SW_MAXIMIZE = 3;
          }

          "@

          # ==========================================================
          # COORDINATES
          # ==========================================================

          $x =
              [int]$env:CLICK_X

          $y =
              [int]$env:CLICK_Y

          Log "=========================================="
          Log "DOUBLE CLICK RECORDING"
          Log "=========================================="

          Log "CLICK_X = $x"
          Log "CLICK_Y = $y"

          # ==========================================================
          # SCREEN
          # ==========================================================

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screen =
              [System.Windows.Forms.Screen]::PrimaryScreen

          if ($null -eq $screen) {
              throw "Primary screen is null."
          }

          $screenX =
              $screen.Bounds.X

          $screenY =
              $screen.Bounds.Y

          $width =
              $screen.Bounds.Width

          $height =
              $screen.Bounds.Height

          Log "Screen X = $screenX"
          Log "Screen Y = $screenY"
          Log "Screen Width = $width"
          Log "Screen Height = $height"

          if ($x -lt $screenX -or
              $x -ge ($screenX + $width)) {

              throw "CLICK_X is outside screen."
          }

          if ($y -lt $screenY -or
              $y -ge ($screenY + $height)) {

              throw "CLICK_Y is outside screen."
          }

          # ==========================================================
          # FIND CHROME
          # ==========================================================

          Log "Finding Chrome window..."

          $chromeWindow = $null

          for ($attempt = 1; $attempt -le 20; $attempt++) {

              $chromeWindow =
                  Get-Process chrome `
                    -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.MainWindowHandle -ne 0
                  } |
                  Sort-Object StartTime -Descending |
                  Select-Object -First 1

              if ($null -ne $chromeWindow) {
                  break
              }

              Start-Sleep -Milliseconds 500
          }

          if ($null -eq $chromeWindow) {
              throw "Chrome window was not found."
          }

          Log "Chrome PID = $($chromeWindow.Id)"
          Log "Chrome HWND = $($chromeWindow.MainWindowHandle)"

          # ==========================================================
          # FORCE MAXIMIZED + FOREGROUND
          # ==========================================================

          [NativeMouse]::ShowWindow(
              $chromeWindow.MainWindowHandle,
              [NativeMouse]::SW_RESTORE
          ) | Out-Null

          Start-Sleep -Milliseconds 300

          [NativeMouse]::ShowWindow(
              $chromeWindow.MainWindowHandle,
              [NativeMouse]::SW_MAXIMIZE
          ) | Out-Null

          Start-Sleep -Milliseconds 500

          [NativeMouse]::SetForegroundWindow(
              $chromeWindow.MainWindowHandle
          ) | Out-Null

          Start-Sleep -Seconds 1

          Log "Chrome maximized and activated."

          # ==========================================================
          # CLEAN OLD OUTPUTS
          # ==========================================================

          Remove-Item `
            $videoFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $screenshotFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ffmpegOutput `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ffmpegError `
            -Force `
            -ErrorAction SilentlyContinue

          # ==========================================================
          # START 20 SECOND VIDEO
          # ==========================================================

          Log "Starting 20 second FFmpeg recording..."

          $ffmpegArgs = @(
              "-y"
              "-f"
              "gdigrab"
              "-framerate"
              "30"
              "-draw_mouse"
              "1"
              "-i"
              "desktop"
              "-t"
              "20"
              "-c:v"
              "libx264"
              "-preset"
              "veryfast"
              "-pix_fmt"
              "yuv420p"
              $videoFile
          )

          $ffmpegProcess =
              Start-Process `
                -FilePath "ffmpeg.exe" `
                -ArgumentList $ffmpegArgs `
                -PassThru `
                -RedirectStandardOutput $ffmpegOutput `
                -RedirectStandardError $ffmpegError

          Log "FFmpeg PID = $($ffmpegProcess.Id)"

          # ==========================================================
          # 0 -> 5 SECONDS
          # ==========================================================

          Log "Waiting 5 seconds before CLICK #1..."

          Start-Sleep -Seconds 5

          # ==========================================================
          # CLICK FUNCTION
          # ==========================================================

          function Perform-Click {

              param(
                  [int]$X,
                  [int]$Y,
                  [string]$Label
              )

              Log "=========================================="
              Log "$Label"
              Log "=========================================="

              Log "Moving cursor to X=$X Y=$Y"

              $moveResult =
                  [NativeMouse]::SetCursorPos(
                      $X,
                      $Y
                  )

              if (-not $moveResult) {
                  throw "SetCursorPos failed."
              }

              Start-Sleep -Milliseconds 500

              $cursor =
                  [System.Windows.Forms.Cursor]::Position

              Log "Actual cursor:"
              Log "X=$($cursor.X)"
              Log "Y=$($cursor.Y)"

              # ------------------------------------------------------
              # LEFT DOWN
              # ------------------------------------------------------

              [NativeMouse]::mouse_event(
                  [NativeMouse]::MOUSEEVENTF_LEFTDOWN,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Start-Sleep -Milliseconds 150

              # ------------------------------------------------------
              # LEFT UP
              # ------------------------------------------------------

              [NativeMouse]::mouse_event(
                  [NativeMouse]::MOUSEEVENTF_LEFTUP,
                  0,
                  0,
                  0,
                  [UIntPtr]::Zero
              )

              Log "$Label SENT."
          }

          # ==========================================================
          # CLICK #1 AT 5 SECONDS
          # ==========================================================

          Perform-Click `
            -X $x `
            -Y $y `
            -Label "CLICK #1"

          # ==========================================================
          # 5 -> 10 SECONDS
          # ==========================================================

          Log "Waiting 5 seconds after CLICK #1..."

          Start-Sleep -Seconds 5

          # ==========================================================
          # CLICK #2 AT 10 SECONDS
          # ==========================================================

          Perform-Click `
            -X $x `
            -Y $y `
            -Label "CLICK #2"

          # ==========================================================
          # 10 -> 20 SECONDS
          # ==========================================================

          Log "Waiting 10 seconds after CLICK #2..."

          Start-Sleep -Seconds 10

          # ==========================================================
          # WAIT FOR VIDEO TO FINISH
          # ==========================================================

          Log "Waiting for FFmpeg to finish..."

          if (-not $ffmpegProcess.HasExited) {
              $ffmpegProcess.WaitForExit()
          }

          Log "FFmpeg exit code = $($ffmpegProcess.ExitCode)"

          # ==========================================================
          # VALIDATE VIDEO
          # ==========================================================

          if (-not (Test-Path $videoFile)) {
              throw "Video file was not created."
          }

          $videoSize =
              (Get-Item $videoFile).Length

          Log "Video size = $videoSize bytes"

          if ($videoSize -le 1000) {
              throw "Video is too small."
          }

          # ==========================================================
          # FINAL SCREENSHOT AFTER VIDEO ENDS
          # ==========================================================

          Log "=========================================="
          Log "TAKING FINAL SCREENSHOT"
          Log "=========================================="

          $bitmap =
              New-Object System.Drawing.Bitmap(
                  $width,
                  $height,
                  [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
              )

          $graphics =
              [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
              $screenX,
              $screenY,
              0,
              0,
              $screen.Bounds.Size
          )

          # ==========================================================
          # RED DOT
          # ==========================================================

          $radius = 8

          $pen =
              New-Object System.Drawing.Pen(
                  [System.Drawing.Color]::Red,
                  3
              )

          $brush =
              New-Object System.Drawing.SolidBrush(
                  [System.Drawing.Color]::FromArgb(
                      140,
                      255,
                      0,
                      0
                  )
              )

          $graphics.FillEllipse(
              $brush,
              ($x - $radius),
              ($y - $radius),
              ($radius * 2),
              ($radius * 2)
          )

          $graphics.DrawEllipse(
              $pen,
              ($x - $radius),
              ($y - $radius),
              ($radius * 2),
              ($radius * 2)
          )

          $bitmap.Save(
              $screenshotFile,
              [System.Drawing.Imaging.ImageFormat]::Png
          )

          $pen.Dispose()
          $brush.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()

          Log "Final screenshot saved."

          # ==========================================================
          # VALIDATE SCREENSHOT
          # ==========================================================

          if (-not (Test-Path $screenshotFile)) {
              throw "Screenshot was not created."
          }

          $screenshotSize =
              (Get-Item $screenshotFile).Length

          Log "Screenshot size = $screenshotSize bytes"

          if ($screenshotSize -le 1000) {
              throw "Screenshot is too small."
          }

          # ==========================================================
          # FFPROBE
          # ==========================================================

          $ffprobe =
              Get-Command ffprobe.exe `
                -ErrorAction SilentlyContinue

          if ($null -ne $ffprobe) {

              $duration =
                  & ffprobe `
                    -v error `
                    -show_entries format=duration `
                    -of default=noprint_wrappers=1:nokey=1 `
                    $videoFile 2>&1

              Log "Video duration = $duration"
          }

          Log "=========================================="
          Log "ALL OPERATIONS COMPLETED"
          Log "=========================================="
          '@

          # ==========================================================
          # WRITE SCRIPT
          # ==========================================================

          Set-Content `
            -Path "C:\temp\RDPClickAndRecord.ps1" `
            -Value $recordingScript `
            -Encoding UTF8

          Write-Host "Recording script created."

          # ==========================================================
          # VALIDATE SCRIPT SYNTAX
          # ==========================================================

          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              "C:\temp\RDPClickAndRecord.ps1",
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "POWERSHELL PARSE ERRORS"
              Write-Host "=========================================="

              foreach ($errorItem in $errors) {
                  Write-Host $errorItem.ToString()
              }

              throw "Recording script has PowerShell syntax errors."
          }

          Write-Host "Recording script syntax: OK."

      # ============================================================
      # RUN RECORDING
      # ============================================================

      - name: Run recording
        shell: powershell
        env:
          CLICK_X: "84"
          CLICK_Y: "614"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "STARTING RECORDING"
          Write-Host "=========================================="

          Write-Host "CLICK_X = $env:CLICK_X"
          Write-Host "CLICK_Y = $env:CLICK_Y"

          $scriptPath =
            "C:\temp\RDPClickAndRecord.ps1"

          if (-not (Test-Path $scriptPath)) {
              throw "Recording script not found."
          }

          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File $scriptPath

          $exitCode =
            $LASTEXITCODE

          Write-Host ""
          Write-Host "Recording script exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "Recording script failed with exit code $exitCode."
          }

      # ============================================================
      # DEBUG OUTPUTS
      # ============================================================

      - name: Debug outputs
        if: always()
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "DEBUG OUTPUTS"
          Write-Host "=========================================="

          $files = @(
            "C:\temp\rdp-click-screenshot.png",
            "C:\temp\rdp-click-video.mp4",
            "C:\temp\click-record.log",
            "C:\temp\ffmpeg-output.log",
            "C:\temp\ffmpeg-error.log",
            "C:\temp\RDPClickAndRecord.ps1"
          )

          foreach ($path in $files) {

              if (Test-Path $path) {

                  $item =
                    Get-Item $path

                  Write-Host ""
                  Write-Host "FOUND:"
                  Write-Host $path
                  Write-Host "SIZE: $($item.Length) bytes"

              }
              else {

                  Write-Host ""
                  Write-Host "NOT FOUND:"
                  Write-Host $path
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CLICK LOG"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\click-record.log") {
              Get-Content "C:\temp\click-record.log"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FFMPEG ERROR"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\ffmpeg-error.log") {
              Get-Content "C:\temp\ffmpeg-error.log"
          }

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload recording outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rdp-record-output
          path: |
            C:\temp\rdp-click-screenshot.png
            C:\temp\rdp-click-video.mp4
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
            C:\temp\RDPClickAndRecord.ps1
          if-no-files-found: warn
          retention-days: 7
