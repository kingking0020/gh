name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      RDP_USERNAME: runneradmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      # مختصات دقیق شما
      CLICK_X: "84"
      CLICK_Y: "614"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # BASIC INFORMATION
      # ============================================================

      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RUNNER INFORMATION"
          Write-Host "=========================================="

          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable

      # ============================================================
      # RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CONFIGURING RDP"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is empty."
          }

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "Updating existing user..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires $true

          }
          else {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Actions RDP account"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 3

          Get-Service TermService |
            Format-Table Name, Status, StartType -AutoSize

          Write-Host ""
          Write-Host "RDP configured."

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          Write-Host "=========================================="
          Write-Host "INSTALLING TAILSCALE"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is empty."
          }

          $tailscaleExe =
              "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {

              $installer =
                  "$env:TEMP\tailscale-setup.exe"

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                -OutFile $installer

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/quiet" `
                -Wait

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable was not found."
          }

          & $tailscaleExe up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp-3" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscaleExe status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $tailscaleIP =
              (& $tailscaleExe ip -4 | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
              throw "Could not obtain Tailscale IPv4."
          }

          Write-Host $tailscaleIP

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME
      # ============================================================

      - name: Check and install Chrome
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "CHECKING CHROME"
          Write-Host "=========================================="

          $paths = @(
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromePath = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {
                  $chromePath = $path
                  break
              }
          }

          if (-not $chromePath) {

              Write-Host "Chrome not found."
              Write-Host "Installing..."

              choco install googlechrome -y --no-progress

              Start-Sleep -Seconds 5

              foreach ($path in $paths) {

                  if (Test-Path $path) {
                      $chromePath = $path
                      break
                  }
              }
          }

          if (-not $chromePath) {
              throw "Chrome executable was not found."
          }

          Write-Host "Chrome:"
          Write-Host $chromePath

          "CHROME_PATH=$chromePath" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME POLICY
      # ============================================================

      - name: Configure Chrome policies
        shell: powershell
        run: |

          $policyPath =
            "HKLM:\Software\Policies\Google\Chrome"

          if (-not (Test-Path $policyPath)) {

              New-Item `
                -Path $policyPath `
                -Force |
                Out-Null
          }

          New-ItemProperty `
            -Path $policyPath `
            -Name "BrowserSignin" `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $policyPath `
            -Name "SyncDisabled" `
            -PropertyType DWord `
            -Value 1 `
            -Force |
            Out-Null

      # ============================================================
      # PREPARE CHROME PROFILE
      # ============================================================

      - name: Prepare Chrome profile
        shell: powershell
        run: |

          $chromeProfile =
            "C:\temp\ChromeProfile"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          Remove-Item `
            $chromeProfile `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $chromeProfile `
            -Force |
            Out-Null

          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

      # ============================================================
      # RDP INFO
      # ============================================================

      - name: Show RDP connection information
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "RDP INFORMATION"
          Write-Host "=========================================="

          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Port:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "Connect to:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host "=========================================="

      # ============================================================
      # VERIFY DESKTOP
      # ============================================================

      - name: Verify interactive desktop
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "VERIFYING DESKTOP"
          Write-Host "=========================================="

          Write-Host "USERNAME:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "SESSIONNAME:"
          Write-Host $env:SESSIONNAME

          Write-Host ""
          Write-Host "QWINSTA:"

          try {
              qwinsta
          }
          catch {
              Write-Host "qwinsta failed."
          }

          Add-Type -AssemblyName System.Windows.Forms

          $screen =
            [System.Windows.Forms.Screen]::PrimaryScreen

          if ($null -eq $screen) {
              throw "PrimaryScreen is null."
          }

          Write-Host ""
          Write-Host "SCREEN:"
          Write-Host "X = $($screen.Bounds.X)"
          Write-Host "Y = $($screen.Bounds.Y)"
          Write-Host "Width = $($screen.Bounds.Width)"
          Write-Host "Height = $($screen.Bounds.Height)"

      # ============================================================
      # START CHROME
      # ============================================================

      - name: Start Chrome
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "STARTING CHROME"
          Write-Host "=========================================="

          $chromePath = $env:CHROME_PATH

          if (-not $chromePath) {
              throw "CHROME_PATH is empty."
          }

          $chromeProfile =
            "C:\temp\ChromeProfile"

          $arguments = @(
            "--no-first-run"
            "--no-default-browser-check"
            "--disable-session-crashed-bubble"
            "--disable-features=Translate"
            "--start-maximized"
            "--new-window"
            "--user-data-dir=$chromeProfile"

            # ======================================================
            # آدرس سایت را فقط در همین خط عوض کن
            # ======================================================
            "https://github.com"
          )

          Write-Host "Opening:"
          Write-Host "https://github.com"

          Start-Process `
            -FilePath $chromePath `
            -ArgumentList $arguments

          Start-Sleep -Seconds 10

          $chromeProcesses =
            Get-Process chrome `
              -ErrorAction SilentlyContinue

          if (-not $chromeProcesses) {
              throw "Chrome process was not found."
          }

          Write-Host ""
          Write-Host "Chrome processes:"

          $chromeProcesses |
            Select-Object Id, MainWindowHandle, MainWindowTitle, Responding |
            Format-Table -AutoSize

      # ============================================================
      # INSTALL FFMPEG
      # ============================================================

      - name: Install FFmpeg
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "CHECKING FFMPEG"
          Write-Host "=========================================="

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {

              choco install ffmpeg -y --no-progress

              Start-Sleep -Seconds 5
          }

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {
              throw "FFmpeg not found."
          }

          Write-Host "FFmpeg:"
          Write-Host $ffmpeg.Source

      # ============================================================
      # CREATE ROBUST CLICK/RECORD SCRIPT
      # ============================================================

      - name: Create recording script
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          @'
          $ErrorActionPreference = "Stop"

          $logFile =
              "C:\temp\click-record.log"

          $videoFile =
              "C:\temp\rdp-click-video.mp4"

          $screenshotFile =
              "C:\temp\rdp-click-screenshot.png"

          $ffmpegOutput =
              "C:\temp\ffmpeg-output.log"

          $ffmpegError =
              "C:\temp\ffmpeg-error.log"

          function Log($text) {

              $line =
                  "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff')  $text"

              Write-Host $line

              Add-Content `
                -Path $logFile `
                -Value $line
          }

          # ==========================================================
          # WIN32 INPUT API
          # ==========================================================

          Add-Type @"

          using System;
          using System.Runtime.InteropServices;

          public static class NativeMouse
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(int X, int Y);

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint dwFlags,
                  uint dx,
                  uint dy,
                  uint dwData,
                  UIntPtr dwExtraInfo
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              public const uint MOUSEEVENTF_LEFTDOWN = 0x0002;
              public const uint MOUSEEVENTF_LEFTUP   = 0x0004;

              public const int SW_RESTORE = 9;
          }

          "@

          # ==========================================================
          # CONFIG
          # ==========================================================

          $x =
              [int]$env:CLICK_X

          $y =
              [int]$env:CLICK_Y

          Log "=========================================="
          Log "ROBUST CLICK RECORDING"
          Log "=========================================="

          Log "CLICK_X = $x"
          Log "CLICK_Y = $y"

          # ==========================================================
          # SCREEN INFORMATION
          # ==========================================================

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screen =
              [System.Windows.Forms.Screen]::PrimaryScreen

          $width =
              $screen.Bounds.Width

          $height =
              $screen.Bounds.Height

          Log "Screen Width = $width"
          Log "Screen Height = $height"

          if ($x -lt $screen.Bounds.Left -or
              $x -ge ($screen.Bounds.Left + $width)) {

              throw "CLICK_X is outside the screen."
          }

          if ($y -lt $screen.Bounds.Top -or
              $y -ge ($screen.Bounds.Top + $height)) {

              throw "CLICK_Y is outside the screen."
          }

          # ==========================================================
          # ACTIVATE CHROME WINDOW
          # ==========================================================

          Log "Finding Chrome window..."

          $chromeWindow = $null

          for ($attempt = 1; $attempt -le 20; $attempt++) {

              $chromeWindow =
                  Get-Process chrome `
                    -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.MainWindowHandle -ne 0
                  } |
                  Select-Object -First 1

              if ($chromeWindow) {
                  break
              }

              Start-Sleep -Milliseconds 500
          }

          if ($chromeWindow) {

              Log "Chrome PID = $($chromeWindow.Id)"
              Log "Chrome HWND = $($chromeWindow.MainWindowHandle)"

              [NativeMouse]::ShowWindow(
                  $chromeWindow.MainWindowHandle,
                  [NativeMouse]::SW_RESTORE
              ) | Out-Null

              Start-Sleep -Milliseconds 500

              [NativeMouse]::SetForegroundWindow(
                  $chromeWindow.MainWindowHandle
              ) | Out-Null

              Start-Sleep -Milliseconds 1000

          }
          else {

              Log "WARNING: Chrome window handle not found."
              Log "Continuing with current foreground window."
          }

          # ==========================================================
          # START FFMPEG
          # ==========================================================

          Log "Starting FFmpeg..."

          Remove-Item `
            $videoFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ffmpegOutput `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ffmpegError `
            -Force `
            -ErrorAction SilentlyContinue

          $ffmpegArgs = @(
              "-y"
              "-f"
              "gdigrab"
              "-framerate"
              "30"
              "-draw_mouse"
              "1"
              "-i"
              "desktop"
              "-t"
              "15"
              "-c:v"
              "libx264"
              "-preset"
              "veryfast"
              "-pix_fmt"
              "yuv420p"
              $videoFile
          )

          $ffmpegProcess =
              Start-Process `
                -FilePath "ffmpeg.exe" `
                -ArgumentList $ffmpegArgs `
                -PassThru `
                -RedirectStandardOutput $ffmpegOutput `
                -RedirectStandardError $ffmpegError

          Log "FFmpeg PID = $($ffmpegProcess.Id)"

          # ==========================================================
          # WAIT BEFORE CLICK
          # ==========================================================

          Log "Waiting 5 seconds before click..."

          Start-Sleep -Seconds 5

          # ==========================================================
          # MOVE CURSOR
          # ==========================================================

          Log "Moving cursor to X=$x Y=$y"

          $moveResult =
              [NativeMouse]::SetCursorPos($x, $y)

          if (-not $moveResult) {
              throw "SetCursorPos failed."
          }

          Start-Sleep -Milliseconds 800

          # ==========================================================
          # VERIFY CURSOR POSITION
          # ==========================================================

          $cursor =
              [System.Windows.Forms.Cursor]::Position

          Log "Actual cursor position:"
          Log "X=$($cursor.X)"
          Log "Y=$($cursor.Y)"

          # ==========================================================
          # SCREENSHOT + RED CIRCLE
          # ==========================================================

          Log "Creating screenshot..."

          $bitmap =
              New-Object System.Drawing.Bitmap(
                  $width,
                  $height,
                  [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
              )

          $graphics =
              [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
              $screen.Bounds.X,
              $screen.Bounds.Y,
              0,
              0,
              $screen.Bounds.Size
          )

          # همان مختصات کلیک را روی اسکرین‌شات علامت بزن
          $radius = 8

          $pen =
              New-Object System.Drawing.Pen(
                  [System.Drawing.Color]::Red,
                  3
              )

          $brush =
              New-Object System.Drawing.SolidBrush(
                  [System.Drawing.Color]::FromArgb(
                      120,
                      255,
                      0,
                      0
                  )
              )

          $graphics.FillEllipse(
              $brush,
              ($x - $radius),
              ($y - $radius),
              ($radius * 2),
              ($radius * 2)
          )

          $graphics.DrawEllipse(
              $pen,
              ($x - $radius),
              ($y - $radius),
              ($radius * 2),
              ($radius * 2)
          )

          $bitmap.Save(
              $screenshotFile,
              [System.Drawing.Imaging.ImageFormat]::Png
          )

          $pen.Dispose()
          $brush.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()

          Log "Screenshot saved."

          # ==========================================================
          # REAL LEFT CLICK
          # ==========================================================

          Log "=========================================="
          Log "PERFORMING REAL MOUSE CLICK"
          Log "=========================================="

          # حرکت دوباره برای اطمینان
          [NativeMouse]::SetCursorPos($x, $y) | Out-Null

          Start-Sleep -Milliseconds 300

          # LEFT DOWN
          [NativeMouse]::mouse_event(
              [NativeMouse]::MOUSEEVENTF_LEFTDOWN,
              0,
              0,
              0,
              [UIntPtr]::Zero
          )

          Start-Sleep -Milliseconds 120

          # LEFT UP
          [NativeMouse]::mouse_event(
              [NativeMouse]::MOUSEEVENTF_LEFTUP,
              0,
              0,
              0,
              [UIntPtr]::Zero
          )

          Log "LEFT CLICK SENT."

          # ==========================================================
          # KEEP RECORDING
          # ==========================================================

          Start-Sleep -Seconds 7

          # ==========================================================
          # WAIT FOR FFMPEG
          # ==========================================================

          Log "Waiting for FFmpeg..."

          if (-not $ffmpegProcess.HasExited) {
              $ffmpegProcess.WaitForExit()
          }

          Log "FFmpeg exit code = $($ffmpegProcess.ExitCode)"

          # ==========================================================
          # VALIDATE OUTPUTS
          # ==========================================================

          if (-not (Test-Path $videoFile)) {
              throw "Video file was not created."
          }

          if (-not (Test-Path $screenshotFile)) {
              throw "Screenshot file was not created."
          }

          $videoSize =
              (Get-Item $videoFile).Length

          $screenshotSize =
              (Get-Item $screenshotFile).Length

          Log "Video size = $videoSize bytes"
          Log "Screenshot size = $screenshotSize bytes"

          if ($videoSize -le 1000) {
              throw "Video file is too small."
          }

          if ($screenshotSize -le 1000) {
              throw "Screenshot file is too small."
          }

          # ==========================================================
          # FFPROBE
          # ==========================================================

          $ffprobe =
              Get-Command ffprobe.exe `
                -ErrorAction SilentlyContinue

          if ($ffprobe) {

              Log "Running ffprobe..."

              $probe =
                  & ffprobe `
                    -v error `
                    -show_entries format=duration `
                    -of default=noprint_wrappers=1:nokey=1 `
                    $videoFile 2>&1

              Log "Video duration = $probe"
          }

          Log "=========================================="
          Log "RECORDING COMPLETED SUCCESSFULLY"
          Log "=========================================="
          '@ |
            Set-Content `
              -Path "C:\temp\RDPClickAndRecord.ps1" `
              -Encoding UTF8

          Write-Host "Recording script created."

      # ============================================================
      # RUN RECORDING
      # ============================================================

      - name: Run recording script
        shell: powershell
        env:
          CLICK_X: "84"
          CLICK_Y: "614"
        run: |

          Write-Host "=========================================="
          Write-Host "STARTING RECORDING"
          Write-Host "=========================================="

          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "C:\temp\RDPClickAndRecord.ps1"

          $exitCode =
              $LASTEXITCODE

          Write-Host ""
          Write-Host "Recording script exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "Recording failed."
          }

      # ============================================================
      # DEBUG
      # ============================================================

      - name: Debug outputs
        if: always()
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "OUTPUT FILES"
          Write-Host "=========================================="

          $files = @(
              "C:\temp\rdp-click-screenshot.png",
              "C:\temp\rdp-click-video.mp4",
              "C:\temp\click-record.log",
              "C:\temp\ffmpeg-output.log",
              "C:\temp\ffmpeg-error.log",
              "C:\temp\RDPClickAndRecord.ps1"
          )

          foreach ($path in $files) {

              if (Test-Path $path) {

                  $item =
                      Get-Item $path

                  Write-Host ""
                  Write-Host "FOUND:"
                  Write-Host $path
                  Write-Host "SIZE: $($item.Length) bytes"
              }
              else {

                  Write-Host ""
                  Write-Host "NOT FOUND:"
                  Write-Host $path
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CLICK LOG"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\click-record.log") {
              Get-Content "C:\temp\click-record.log"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FFMPEG ERROR"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\ffmpeg-error.log") {
              Get-Content "C:\temp\ffmpeg-error.log"
          }

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload RDP recording outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rdp-record-output
          path: |
            C:\temp\rdp-click-screenshot.png
            C:\temp\rdp-click-video.mp4
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
            C:\temp\RDPClickAndRecord.ps1
          if-no-files-found: warn
          retention-days: 7
