name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      RDP_USERNAME: runneradmin

      # ============================================================
      # RDP PASSWORD
      # این مقدار را با پسورد خودت عوض کن.
      # باید شامل حروف بزرگ/کوچک + عدد + کاراکتر ویژه باشد.
      # ============================================================
      RDP_PASSWORD: "RdpAccess#2026X"

      # ============================================================
      # CLICK COORDINATES
      # ============================================================
      CLICK_X: "84"
      CLICK_Y: "614"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # BASIC INFORMATION
      # ============================================================

      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RUNNER INFORMATION"
          Write-Host "=========================================="

          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable

      # ============================================================
      # SHOW RDP LOGIN
      # ============================================================

      - name: Show RDP login
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RDP LOGIN"
          Write-Host "=========================================="

          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host "=========================================="

      # ============================================================
      # CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CONFIGURING RDP"
          Write-Host "=========================================="

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($username)) {
              throw "RDP_USERNAME is empty."
          }

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD is empty."
          }

          Write-Host "Username: $username"
          Write-Host "Password: $password"

          # ----------------------------------------------------------
          # Convert password
          # ----------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # ----------------------------------------------------------
          # Check password policy
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Checking local password policy..."

          try {
              net accounts
          }
          catch {
              Write-Host "Could not read password policy."
          }

          # ----------------------------------------------------------
          # Create or update user
          # ----------------------------------------------------------

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -ne $existingUser) {

              Write-Host ""
              Write-Host "User already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword `
                -ErrorAction Stop

              try {
                  Set-LocalUser `
                    -Name $username `
                    -PasswordNeverExpires $true `
                    -ErrorAction Stop
              }
              catch {
                  Write-Host "PasswordNeverExpires update skipped."
                  Write-Host $_.Exception.Message
              }

              Write-Host "Password updated successfully."
          }
          else {

              Write-Host ""
              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Actions RDP account" `
                -ErrorAction Stop

              Write-Host "User created successfully."
          }

          # ----------------------------------------------------------
          # Administrators
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Checking Administrators membership..."

          $adminMember = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $adminMember) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $username `
                -ErrorAction Stop

              Write-Host "Added to Administrators."
          }
          else {

              Write-Host "Already in Administrators."
          }

          # ----------------------------------------------------------
          # Remote Desktop Users
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Checking Remote Desktop Users membership..."

          $rdpMember = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $rdpMember) {

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $username `
                -ErrorAction Stop

              Write-Host "Added to Remote Desktop Users."
          }
          else {

              Write-Host "Already in Remote Desktop Users."
          }

          # ----------------------------------------------------------
          # Enable RDP
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Enabling RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # NLA
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # ----------------------------------------------------------
          # Firewall
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Enabling Remote Desktop firewall rules..."

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule `
            -ErrorAction SilentlyContinue

          # ----------------------------------------------------------
          # TermService
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "Configuring TermService..."

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic `
            -ErrorAction Stop

          $termService =
            Get-Service -Name "TermService"

          if ($termService.Status -eq "Running") {

              Restart-Service `
                -Name "TermService" `
                -Force `
                -ErrorAction Stop
          }
          else {

              Start-Service `
                -Name "TermService" `
                -ErrorAction Stop
          }

          Start-Sleep -Seconds 4

          $termService =
            Get-Service -Name "TermService"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP SERVICE"
          Write-Host "=========================================="

          $termService |
            Format-Table Name, Status, StartType -AutoSize

          if ($termService.Status -ne "Running") {
              throw "TermService is not running."
          }

          Write-Host ""
          Write-Host "RDP configured successfully."

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "TAILSCALE"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY is empty."
          }

          $tailscaleExe =
            "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {

              $installer =
                "$env:TEMP\tailscale-setup.exe"

              Write-Host "Downloading Tailscale..."

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                -OutFile $installer

              Write-Host "Installing Tailscale..."

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/quiet" `
                -Wait

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable was not found."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscaleExe up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-actions-rdp-3" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=== TAILSCALE STATUS ==="

          & $tailscaleExe status

          Write-Host ""
          Write-Host "=== TAILSCALE IPV4 ==="

          $tailscaleIP =
            (& $tailscaleExe ip -4 | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
              throw "Could not obtain Tailscale IPv4."
          }

          Write-Host $tailscaleIP

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME
      # ============================================================

      - name: Check and install Chrome
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHROME"
          Write-Host "=========================================="

          $paths = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromePath = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {
                  $chromePath = $path
                  break
              }
          }

          if (-not $chromePath) {

              Write-Host "Chrome not found."
              Write-Host "Installing Chrome..."

              choco install googlechrome -y --no-progress

              Start-Sleep -Seconds 6

              foreach ($path in $paths) {

                  if (Test-Path $path) {
                      $chromePath = $path
                      break
                  }
              }
          }

          if (-not $chromePath) {
              throw "Chrome executable was not found."
          }

          Write-Host "Chrome:"
          Write-Host $chromePath

          "CHROME_PATH=$chromePath" |
            Out-File `
              "$env:GITHUB_ENV" `
              -Encoding utf8

      # ============================================================
      # CHROME POLICY
      # ============================================================

      - name: Configure Chrome policies
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $policyPath =
            "HKLM:\Software\Policies\Google\Chrome"

          if (-not (Test-Path $policyPath)) {

              New-Item `
                -Path $policyPath `
                -Force |
                Out-Null
          }

          New-ItemProperty `
            -Path $policyPath `
            -Name "BrowserSignin" `
            -PropertyType DWord `
            -Value 0 `
            -Force |
            Out-Null

          New-ItemProperty `
            -Path $policyPath `
            -Name "SyncDisabled" `
            -PropertyType DWord `
            -Value 1 `
            -Force |
            Out-Null

          Write-Host "Chrome policies configured."

      # ============================================================
      # CHROME PROFILE
      # ============================================================

      - name: Prepare Chrome profile
        shell: powershell
        run: |

          $chromeProfile =
            "C:\temp\ChromeProfile"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          Get-Process chrome `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          Remove-Item `
            $chromeProfile `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $chromeProfile `
            -Force |
            Out-Null

          Write-Host "Chrome profile ready."

      # ============================================================
      # RDP INFO
      # ============================================================

      - name: Show RDP connection information
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "RDP CONNECTION"
          Write-Host "=========================================="

          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "Port:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "Click X:"
          Write-Host $env:CLICK_X

          Write-Host "Click Y:"
          Write-Host $env:CLICK_Y

          Write-Host "=========================================="

      # ============================================================
      # VERIFY DESKTOP
      # ============================================================

      - name: Verify interactive desktop
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "VERIFYING DESKTOP"
          Write-Host "=========================================="

          Write-Host "USERNAME:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "SESSIONNAME:"
          Write-Host $env:SESSIONNAME

          Write-Host ""
          Write-Host "QWINSTA:"

          try {
              qwinsta
          }
          catch {
              Write-Host $_.Exception.Message
          }

          Add-Type -AssemblyName System.Windows.Forms

          $screen =
            [System.Windows.Forms.Screen]::PrimaryScreen

          if ($null -eq $screen) {
              throw "PrimaryScreen is null."
          }

          Write-Host ""
          Write-Host "SCREEN:"
          Write-Host "X=$($screen.Bounds.X)"
          Write-Host "Y=$($screen.Bounds.Y)"
          Write-Host "Width=$($screen.Bounds.Width)"
          Write-Host "Height=$($screen.Bounds.Height)"

      # ============================================================
      # START CHROME
      # ============================================================

      - name: Start Chrome
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "STARTING CHROME"
          Write-Host "=========================================="

          $chromePath =
            $env:CHROME_PATH

          if ([string]::IsNullOrWhiteSpace($chromePath)) {
              throw "CHROME_PATH is empty."
          }

          if (-not (Test-Path $chromePath)) {
              throw "Chrome does not exist: $chromePath"
          }

          $chromeProfile =
            "C:\temp\ChromeProfile"

          $arguments = @(
            "--no-first-run"
            "--no-default-browser-check"
            "--disable-session-crashed-bubble"
            "--disable-features=Translate"
            "--start-maximized"
            "--new-window"
            "--user-data-dir=$chromeProfile"

            # ======================================================
            # URL را اینجا تغییر بده
            # ======================================================
            "https://github.com"
          )

          Write-Host "Opening URL:"
          Write-Host "https://github.com"

          $chromeProcess =
            Start-Process `
              -FilePath $chromePath `
              -ArgumentList $arguments `
              -PassThru

          if ($null -eq $chromeProcess) {
              throw "Chrome failed to start."
          }

          Write-Host "Chrome PID: $($chromeProcess.Id)"

          Start-Sleep -Seconds 10

          $chromeProcesses =
            Get-Process chrome `
              -ErrorAction SilentlyContinue

          if (-not $chromeProcesses) {
              throw "Chrome process was not found."
          }

          $chromeProcesses |
            Select-Object `
              Id,
              MainWindowHandle,
              MainWindowTitle,
              Responding |
            Format-Table -AutoSize

      # ============================================================
      # FFMPEG
      # ============================================================

      - name: Install FFmpeg
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FFMPEG"
          Write-Host "=========================================="

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {

              Write-Host "Installing FFmpeg..."

              choco install ffmpeg -y --no-progress

              Start-Sleep -Seconds 5
          }

          $ffmpeg =
            Get-Command ffmpeg.exe `
              -ErrorAction SilentlyContinue

          if (-not $ffmpeg) {
              throw "FFmpeg was not found."
          }

          Write-Host "FFmpeg:"
          Write-Host $ffmpeg.Source

      # ============================================================
      # CREATE RECORDING SCRIPT
      # ============================================================

      - name: Create recording script
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          @'
          $ErrorActionPreference = "Stop"

          $logFile =
              "C:\temp\click-record.log"

          $videoFile =
              "C:\temp\rdp-click-video.mp4"

          $screenshotFile =
              "C:\temp\rdp-click-screenshot.png"

          $ffmpegOutput =
              "C:\temp\ffmpeg-output.log"

          $ffmpegError =
              "C:\temp\ffmpeg-error.log"

          function Log($text) {

              $line =
                  "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff')  $text"

              Write-Host $line

              Add-Content `
                -Path $logFile `
                -Value $line
          }

          # ==========================================================
          # WIN32 MOUSE API
          # ==========================================================

          Add-Type @"

          using System;
          using System.Runtime.InteropServices;

          public static class NativeMouse
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(
                  int X,
                  int Y
              );

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint dwFlags,
                  uint dx,
                  uint dy,
                  uint dwData,
                  UIntPtr dwExtraInfo
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(
                  IntPtr hWnd
              );

              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              public const uint MOUSEEVENTF_LEFTDOWN = 0x0002;
              public const uint MOUSEEVENTF_LEFTUP   = 0x0004;

              public const int SW_RESTORE = 9;
          }

          "@

          # ==========================================================
          # COORDINATES
          # ==========================================================

          $x =
              [int]$env:CLICK_X

          $y =
              [int]$env:CLICK_Y

          Log "=========================================="
          Log "CLICK RECORDING"
          Log "=========================================="

          Log "CLICK_X = $x"
          Log "CLICK_Y = $y"

          # ==========================================================
          # SCREEN
          # ==========================================================

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screen =
              [System.Windows.Forms.Screen]::PrimaryScreen

          if ($null -eq $screen) {
              throw "PrimaryScreen is null."
          }

          $screenX =
              $screen.Bounds.X

          $screenY =
              $screen.Bounds.Y

          $width =
              $screen.Bounds.Width

          $height =
              $screen.Bounds.Height

          Log "Screen X = $screenX"
          Log "Screen Y = $screenY"
          Log "Screen Width = $width"
          Log "Screen Height = $height"

          # ==========================================================
          # VALIDATE COORDINATES
          # ==========================================================

          if ($x -lt $screenX -or
              $x -ge ($screenX + $width)) {

              throw "CLICK_X is outside screen."
          }

          if ($y -lt $screenY -or
              $y -ge ($screenY + $height)) {

              throw "CLICK_Y is outside screen."
          }

          # ==========================================================
          # FIND CHROME
          # ==========================================================

          Log "Finding Chrome window..."

          $chromeWindow = $null

          for ($attempt = 1; $attempt -le 20; $attempt++) {

              $chromeWindow =
                  Get-Process chrome `
                    -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.MainWindowHandle -ne 0
                  } |
                  Sort-Object MainWindowHandle -Descending |
                  Select-Object -First 1

              if ($null -ne $chromeWindow) {
                  break
              }

              Start-Sleep -Milliseconds 500
          }

          if ($null -ne $chromeWindow) {

              Log "Chrome PID = $($chromeWindow.Id)"
              Log "Chrome HWND = $($chromeWindow.MainWindowHandle)"

              [NativeMouse]::ShowWindow(
                  $chromeWindow.MainWindowHandle,
                  [NativeMouse]::SW_RESTORE
              ) | Out-Null

              Start-Sleep -Milliseconds 500

              [NativeMouse]::SetForegroundWindow(
                  $chromeWindow.MainWindowHandle
              ) | Out-Null

              Start-Sleep -Milliseconds 1000

              Log "Chrome activated."
          }
          else {

              Log "WARNING: Chrome window not found."
          }

          # ==========================================================
          # START FFMPEG
          # ==========================================================

          Log "Starting FFmpeg..."

          Remove-Item `
            $videoFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $screenshotFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ffmpegOutput `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ffmpegError `
            -Force `
            -ErrorAction SilentlyContinue

          $ffmpegArgs = @(
              "-y"
              "-f"
              "gdigrab"
              "-framerate"
              "30"
              "-draw_mouse"
              "1"
              "-i"
              "desktop"
              "-t"
              "15"
              "-c:v"
              "libx264"
              "-preset"
              "veryfast"
              "-pix_fmt"
              "yuv420p"
              $videoFile
          )

          $ffmpegProcess =
              Start-Process `
                -FilePath "ffmpeg.exe" `
                -ArgumentList $ffmpegArgs `
                -PassThru `
                -RedirectStandardOutput $ffmpegOutput `
                -RedirectStandardError $ffmpegError

          Log "FFmpeg PID = $($ffmpegProcess.Id)"

          # ==========================================================
          # WAIT BEFORE CLICK
          # ==========================================================

          Log "Waiting 5 seconds..."

          Start-Sleep -Seconds 5

          # ==========================================================
          # MOVE TO EXACT COORDINATES
          # ==========================================================

          Log "Moving mouse to X=$x Y=$y"

          $result =
              [NativeMouse]::SetCursorPos(
                  $x,
                  $y
              )

          if (-not $result) {
              throw "SetCursorPos failed."
          }

          Start-Sleep -Milliseconds 800

          # ==========================================================
          # VERIFY ACTUAL CURSOR POSITION
          # ==========================================================

          $cursor =
              [System.Windows.Forms.Cursor]::Position

          Log "Actual cursor position:"
          Log "X=$($cursor.X)"
          Log "Y=$($cursor.Y)"

          # ==========================================================
          # SCREENSHOT
          # ==========================================================

          Log "Creating screenshot..."

          $bitmap =
              New-Object System.Drawing.Bitmap(
                  $width,
                  $height,
                  [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
              )

          $graphics =
              [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
              $screenX,
              $screenY,
              0,
              0,
              $screen.Bounds.Size
          )

          # ==========================================================
          # RED DOT
          # ==========================================================

          $radius = 8

          $pen =
              New-Object System.Drawing.Pen(
                  [System.Drawing.Color]::Red,
                  3
              )

          $brush =
              New-Object System.Drawing.SolidBrush(
                  [System.Drawing.Color]::FromArgb(
                      140,
                      255,
                      0,
                      0
                  )
              )

          $graphics.FillEllipse(
              $brush,
              ($x - $radius),
              ($y - $radius),
              ($radius * 2),
              ($radius * 2)
          )

          $graphics.DrawEllipse(
              $pen,
              ($x - $radius),
              ($y - $radius),
              ($radius * 2),
              ($radius * 2)
          )

          $bitmap.Save(
              $screenshotFile,
              [System.Drawing.Imaging.ImageFormat]::Png
          )

          $pen.Dispose()
          $brush.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()

          Log "Screenshot saved."

          # ==========================================================
          # REAL LEFT CLICK
          # ==========================================================

          Log "=========================================="
          Log "SENDING REAL LEFT CLICK"
          Log "=========================================="

          # Move again
          [NativeMouse]::SetCursorPos(
              $x,
              $y
          ) | Out-Null

          Start-Sleep -Milliseconds 300

          # LEFT DOWN
          [NativeMouse]::mouse_event(
              [NativeMouse]::MOUSEEVENTF_LEFTDOWN,
              0,
              0,
              0,
              [UIntPtr]::Zero
          )

          Start-Sleep -Milliseconds 150

          # LEFT UP
          [NativeMouse]::mouse_event(
              [NativeMouse]::MOUSEEVENTF_LEFTUP,
              0,
              0,
              0,
              [UIntPtr]::Zero
          )

          Log "LEFT CLICK SENT."

          # ==========================================================
          # CONTINUE RECORDING
          # ==========================================================

          Start-Sleep -Seconds 7

          # ==========================================================
          # WAIT FOR FFMPEG
          # ==========================================================

          Log "Waiting for FFmpeg..."

          if (-not $ffmpegProcess.HasExited) {
              $ffmpegProcess.WaitForExit()
          }

          Log "FFmpeg exit code = $($ffmpegProcess.ExitCode)"

          # ==========================================================
          # VALIDATE OUTPUT
          # ==========================================================

          if (-not (Test-Path $videoFile)) {
              throw "Video was not created."
          }

          if (-not (Test-Path $screenshotFile)) {
              throw "Screenshot was not created."
          }

          $videoSize =
              (Get-Item $videoFile).Length

          $screenshotSize =
              (Get-Item $screenshotFile).Length

          Log "Video size = $videoSize bytes"
          Log "Screenshot size = $screenshotSize bytes"

          if ($videoSize -le 1000) {
              throw "Video file is too small."
          }

          if ($screenshotSize -le 1000) {
              throw "Screenshot file is too small."
          }

          # ==========================================================
          # FFPROBE
          # ==========================================================

          $ffprobe =
              Get-Command ffprobe.exe `
                -ErrorAction SilentlyContinue

          if ($null -ne $ffprobe) {

              $probe =
                  & ffprobe `
                    -v error `
                    -show_entries format=duration `
                    -of default=noprint_wrappers=1:nokey=1 `
                    $videoFile 2>&1

              Log "Video duration = $probe"
          }

          Log "=========================================="
          Log "RECORDING COMPLETED SUCCESSFULLY"
          Log "=========================================="

          '@ |
            Set-Content `
              -Path "C:\temp\RDPClickAndRecord.ps1" `
              -Encoding UTF8

          Write-Host "Recording script created."

      # ============================================================
      # RUN RECORDING
      # ============================================================

      - name: Run recording
        shell: powershell
        env:
          CLICK_X: "84"
          CLICK_Y: "614"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "STARTING CLICK RECORDING"
          Write-Host "=========================================="

          Write-Host "CLICK_X = $env:CLICK_X"
          Write-Host "CLICK_Y = $env:CLICK_Y"

          $scriptPath =
            "C:\temp\RDPClickAndRecord.ps1"

          if (-not (Test-Path $scriptPath)) {
              throw "Recording script not found."
          }

          powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File $scriptPath

          $exitCode =
            $LASTEXITCODE

          Write-Host ""
          Write-Host "Recording script exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "Recording script failed with exit code $exitCode."
          }

      # ============================================================
      # DEBUG
      # ============================================================

      - name: Debug outputs
        if: always()
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "DEBUG OUTPUTS"
          Write-Host "=========================================="

          $files = @(
            "C:\temp\rdp-click-screenshot.png",
            "C:\temp\rdp-click-video.mp4",
            "C:\temp\click-record.log",
            "C:\temp\ffmpeg-output.log",
            "C:\temp\ffmpeg-error.log",
            "C:\temp\RDPClickAndRecord.ps1"
          )

          foreach ($path in $files) {

              if (Test-Path $path) {

                  $item =
                    Get-Item $path

                  Write-Host ""
                  Write-Host "FOUND:"
                  Write-Host $path
                  Write-Host "SIZE: $($item.Length) bytes"

              }
              else {

                  Write-Host ""
                  Write-Host "NOT FOUND:"
                  Write-Host $path
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CLICK LOG"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\click-record.log") {
              Get-Content "C:\temp\click-record.log"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FFMPEG ERROR"
          Write-Host "=========================================="

          if (Test-Path "C:\temp\ffmpeg-error.log") {
              Get-Content "C:\temp\ffmpeg-error.log"
          }

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload recording outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rdp-record-output
          path: |
            C:\temp\rdp-click-screenshot.png
            C:\temp\rdp-click-video.mp4
            C:\temp\click-record.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
            C:\temp\RDPClickAndRecord.ps1
          if-no-files-found: warn
          retention-days: 7
