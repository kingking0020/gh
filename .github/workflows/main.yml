name: Windows RDP + Tailscale + Chrome + Click Record

on:
  workflow_dispatch:

jobs:
  rdp-record:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "=== Configuring RDP ==="

          $username = "runneradmin"
          $password = "WindowsRDP#2025"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          try {
              Get-LocalUser -Name $username -ErrorAction Stop | Out-Null
              Set-LocalUser -Name $username -Password $securePassword
          }
          catch {
              New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires -UserMayNotChangePassword
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "RDP configured."

      - name: Install and Start Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Installing Tailscale ==="

          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              $installer = "$env:TEMP\tailscale-setup.exe"

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                -OutFile $installer

              Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait
              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable was not found."
          }

          & $tailscaleExe up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="github-actions-rdp-3" --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Start-Sleep -Seconds 5

          Write-Host "=== Tailscale Status ==="
          & $tailscaleExe status

          Write-Host "=== Tailscale IP ==="
          $tailscaleIP = (& $tailscaleExe ip -4 | Select-Object -First 1).Trim()

          if (-not $tailscaleIP) {
              throw "Could not obtain Tailscale IPv4 address."
          }

          Write-Host $tailscaleIP

      - name: Check Chrome
        shell: powershell
        run: |
          Write-Host "=== Checking Chrome ==="

          $paths = @(
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromePath = $null

          foreach ($p in $paths) {
              if (Test-Path $p) {
                  $chromePath = $p
                  break
              }
          }

          if (-not $chromePath) {
              Write-Host "Chrome not found. Installing..."
              choco install googlechrome -y --no-progress
              Start-Sleep -Seconds 5

              foreach ($p in $paths) {
                  if (Test-Path $p) {
                      $chromePath = $p
                      break
                  }
              }
          }

          if (-not $chromePath) {
              throw "Chrome executable not found."
          }

          Write-Host "Chrome found: $chromePath"
          "CHROME_PATH=$chromePath" | Out-File "$env:GITHUB_ENV" -Encoding utf8

      - name: Create Chrome Task
        shell: powershell
        run: |
          Write-Host "=== Creating Chrome task ==="

          $taskName = "OpenChromeAutomatically"
          $chromePath = $env:CHROME_PATH

          if (-not $chromePath) {
              throw "CHROME_PATH is empty."
          }

          if (-not (Test-Path $chromePath)) {
              throw "Chrome executable not found: $chromePath"
          }

          $oldTask = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue

          if ($oldTask) {
              Write-Host "Removing existing Chrome task..."
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

          $action = New-ScheduledTaskAction `
            -Execute $chromePath `
            -Argument '--start-maximized --new-window https://github.com'

          $trigger = New-ScheduledTaskTrigger `
            -AtLogOn `
            -User "runneradmin"

          $principal = New-ScheduledTaskPrincipal `
            -UserId "runneradmin" `
            -LogonType InteractiveToken `
            -RunLevel Highest

          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries `
            -DontStopIfGoingOnBatteries `
            -StartWhenAvailable

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Settings $settings `
            -Force | Out-Null

          Write-Host "Chrome task created successfully."

          Get-ScheduledTask -TaskName $taskName |
            Format-List TaskName, State, TaskPath

          (Get-ScheduledTask -TaskName $taskName).Actions |
            Format-List Execute, Arguments

      - name: Start RDP Session
        shell: powershell
        run: |
          Write-Host "=== Starting RDP session ==="

          Start-Process mstsc.exe -ArgumentList "/v:127.0.0.1 /f"

          Write-Host "Waiting 100 seconds for RDP session..."
          Start-Sleep -Seconds 100

          Write-Host "=== QUSER ==="
          quser

          Write-Host "=== QWINSTA ==="
          qwinsta

      - name: Start Chrome
        shell: powershell
        run: |
          Write-Host "=== Starting Chrome task ==="

          $taskName = "OpenChromeAutomatically"

          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue

          if (-not $task) {
              throw "Chrome scheduled task does not exist."
          }

          Start-ScheduledTask -TaskName $taskName

          Write-Host "Chrome task started."
          Start-Sleep -Seconds 15

          Write-Host "=== Chrome Processes ==="

          $chromeProcesses = Get-Process chrome -ErrorAction SilentlyContinue

          if ($chromeProcesses) {
              $chromeProcesses |
                Select-Object Id, ProcessName, MainWindowTitle |
                Format-Table -AutoSize
          }
          else {
              throw "Chrome process was not found after task start."
          }

      - name: Install FFmpeg
        shell: powershell
        run: |
          Write-Host "=== Installing FFmpeg ==="

          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
              choco install ffmpeg -y --no-progress
              Start-Sleep -Seconds 5
          }

          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
              throw "FFmpeg was not found."
          }

          ffmpeg -version | Select-Object -First 3

      - name: Install recording script
        shell: powershell
        run: |
          Write-Host "=== Installing recording script ==="

          New-Item -ItemType Directory -Path "C:\temp" -Force | Out-Null

          if (-not (Test-Path "scripts\record.ps1")) {
              throw "scripts\record.ps1 was not found in repository."
          }

          Copy-Item "scripts\record.ps1" "C:\temp\RDPClickAndRecord.ps1" -Force

          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              "C:\temp\RDPClickAndRecord.ps1",
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
              foreach ($e in $errors) {
                  Write-Host $e.ToString()
              }
              throw "Recording script contains PowerShell syntax errors."
          }

          Write-Host "PowerShell parser: OK"

      - name: Create recording launcher
        shell: powershell
        run: |
          Write-Host "=== Creating launcher ==="

          $launcher = @"
          @echo off
          echo TASK STARTED > C:\temp\task-started.txt
          echo [%date% %time%] Launcher started >> C:\temp\task-launcher.log
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\temp\RDPClickAndRecord.ps1" >> C:\temp\task-powershell-output.log 2>&1
          echo [%date% %time%] PowerShell exit code: %ERRORLEVEL% >> C:\temp\task-launcher.log
          exit /b %ERRORLEVEL%
          "@

          Set-Content -Path "C:\temp\record-launcher.cmd" -Value $launcher.Trim() -Encoding ASCII
          Write-Host "Launcher created."

      - name: Create recording task
        shell: powershell
        run: |
          Write-Host "=== Creating recording task ==="

          $taskName = "RDPClickAndRecord"
          $launcher = "C:\temp\record-launcher.cmd"

          if (-not (Test-Path $launcher)) {
              throw "Recording launcher not found: $launcher"
          }

          $oldTask = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue

          if ($oldTask) {
              Write-Host "Removing existing recording task..."
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

          $action = New-ScheduledTaskAction `
            -Execute "C:\Windows\System32\cmd.exe" `
            -Argument "/c `"$launcher`""

          $trigger = New-ScheduledTaskTrigger `
            -AtLogOn `
            -User "runneradmin"

          $principal = New-ScheduledTaskPrincipal `
            -UserId "runneradmin" `
            -LogonType InteractiveToken `
            -RunLevel Highest

          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries `
            -DontStopIfGoingOnBatteries `
            -StartWhenAvailable

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Settings $settings `
            -Force | Out-Null

          Write-Host "Recording task created successfully."

          Get-ScheduledTask -TaskName $taskName |
            Format-List TaskName, State, TaskPath

      - name: Run recording task
        shell: powershell
        run: |
          Write-Host "=== Running recording task ==="

          $taskName = "RDPClickAndRecord"

          Remove-Item `
            "C:\temp\task-started.txt", `
            "C:\temp\task-launcher.log", `
            "C:\temp\task-powershell-output.log", `
            "C:\temp\click-record.log" `
            -Force -ErrorAction SilentlyContinue

          if (-not (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) {
              throw "Recording task does not exist."
          }

          Start-ScheduledTask -TaskName $taskName

          Write-Host "Recording task started."
          Write-Host "Waiting 25 seconds..."
          Start-Sleep -Seconds 25

          Write-Host "=== Recording task status ==="

          $info = Get-ScheduledTaskInfo -TaskName $taskName
          $info | Format-List LastRunTime, LastTaskResult, NextRunTime

          Write-Host "=== C:\temp ==="

          Get-ChildItem "C:\temp" -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Sort-Object LastWriteTime -Descending |
            Format-Table -AutoSize

      - name: Debug outputs
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Debug outputs ==="

          $files = @(
              "C:\temp\rdp-click-screenshot.png",
              "C:\temp\rdp-click-video.mp4",
              "C:\temp\click-record.log",
              "C:\temp\task-started.txt",
              "C:\temp\task-launcher.log",
              "C:\temp\task-powershell-output.log",
              "C:\temp\ffmpeg-output.log",
              "C:\temp\ffmpeg-error.log"
          )

          foreach ($p in $files) {
              if (Test-Path $p) {
                  $f = Get-Item $p
                  Write-Host "FOUND $p ($($f.Length) bytes)"
              }
              else {
                  Write-Host "NOT FOUND $p"
              }
          }

          if (Test-Path "C:\temp\click-record.log") {
              Write-Host "--- click-record.log ---"
              Get-Content "C:\temp\click-record.log"
          }

          if (Test-Path "C:\temp\task-launcher.log") {
              Write-Host "--- task-launcher.log ---"
              Get-Content "C:\temp\task-launcher.log"
          }

          if (Test-Path "C:\temp\task-powershell-output.log") {
              Write-Host "--- task-powershell-output.log ---"
              Get-Content "C:\temp\task-powershell-output.log"
          }

          if (Test-Path "C:\temp\ffmpeg-error.log") {
              Write-Host "--- ffmpeg-error.log ---"
              Get-Content "C:\temp\ffmpeg-error.log"
          }

      - name: Upload Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-screenshot
          path: C:\temp\rdp-click-screenshot.png
          if-no-files-found: warn

      - name: Upload Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-video
          path: C:\temp\rdp-click-video.mp4
          if-no-files-found: warn

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-debug-logs
          path: |
            C:\temp\click-record.log
            C:\temp\task-started.txt
            C:\temp\task-launcher.log
            C:\temp\task-powershell-output.log
            C:\temp\ffmpeg-output.log
            C:\temp\ffmpeg-error.log
          if-no-files-found: warn
