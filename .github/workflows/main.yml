name: Pure RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:

      # ============================================================
      # 1. CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          $password = "WindowsRDP#2025"

          $user = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($user) {
              net user runneradmin $password
          }
          else {
              net user runneradmin $password /add
          }

          $admins = net localgroup Administrators

          if ($admins -notmatch "runneradmin") {
              net localgroup Administrators runneradmin /add
          }

          "RDP_USER=runneradmin" |
            Out-File $env:GITHUB_ENV -Append

          "RDP_PASS=$password" |
            Out-File $env:GITHUB_ENV -Append

      # ============================================================
      # 2. INSTALL GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $chrome64 = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          $chrome32 = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"

          if (Test-Path $chrome64) {
              $chrome = $chrome64
          }
          elseif (Test-Path $chrome32) {
              $chrome = $chrome32
          }
          else {
              $installer = "$env:TEMP\chrome_installer.exe"

              Invoke-WebRequest `
                -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
                -OutFile $installer

              Start-Process `
                -FilePath $installer `
                -ArgumentList "/silent", "/install" `
                -Wait `
                -NoNewWindow

              Remove-Item `
                $installer `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 5

              if (Test-Path $chrome64) {
                  $chrome = $chrome64
              }
              elseif (Test-Path $chrome32) {
                  $chrome = $chrome32
              }
              else {
                  throw "Chrome installation failed."
              }
          }

          "CHROME_PATH=$chrome" |
            Out-File $env:GITHUB_ENV -Append

      # ============================================================
      # 3. CREATE CHROME SCRIPT
      # ============================================================
      - name: Create Chrome Script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "C:\temp" `
            -Force |
            Out-Null

          $scriptPath = "C:\temp\OpenChrome.ps1"

          $chromeScript = @'
          Write-Host "Chrome task started."

          Start-Sleep -Seconds 5

          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"

          if (-not (Test-Path $chrome)) {
              $chrome = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          }

          if (-not (Test-Path $chrome)) {
              exit 1
          }

          $chromeArguments = @(
              "--no-first-run"
              "--no-default-browser-check"
              "--disable-features=WelcomeToChrome"
              "--start-maximized"
              "https://github.com"
          )

          Start-Process `
            -FilePath $chrome `
            -ArgumentList $chromeArguments

          Write-Host "Chrome launched."
          '@

          Set-Content `
            -Path $scriptPath `
            -Value $chromeScript `
            -Encoding UTF8

      # ============================================================
      # 4. CREATE CHROME SCHEDULED TASK
      # ============================================================
      - name: Create Chrome Scheduled Task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $taskName = "OpenChromeAutomatically"

          cmd.exe /c "schtasks /query /tn `"$taskName`" >nul 2>&1"

          if ($LASTEXITCODE -eq 0) {
              cmd.exe /c "schtasks /delete /tn `"$taskName`" /f >nul 2>&1"

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to delete existing Chrome task."
              }
          }

          $createArguments = @(
              "/create"
              "/tn"
              $taskName
              "/tr"
              'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\temp\OpenChrome.ps1'
              "/sc"
              "ONLOGON"
              "/ru"
              "runneradmin"
              "/rp"
              "WindowsRDP#2025"
              "/it"
              "/f"
          )

          & schtasks.exe @createArguments

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create Chrome scheduled task."
          }

          & schtasks.exe `
            /query `
            /tn $taskName `
            /fo LIST

          if ($LASTEXITCODE -ne 0) {
              throw "Chrome task verification failed."
          }

      # ============================================================
      # 5. INSTALL + CONNECT TAILSCALE
      # ============================================================
      - name: Install and Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -NoNewWindow

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale executable not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY is missing."
          }

          $log = "$env:TEMP\tailscale.log"

          & $tailscale up `
            --auth-key="$env:TS_AUTH_KEY" `
            --hostname="github-runner-$env:GITHUB_RUN_ID" `
            *> $log

          $exitCode = $LASTEXITCODE

          Remove-Item `
            $log `
            -Force `
            -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
              throw "Tailscale authentication failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {

              $ip = & $tailscale ip -4 2>$null

              if ($ip) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $ip) {
              throw "Tailscale IPv4 not found."
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Tailscale IP:"
          Write-Host $ip

      # ============================================================
      # 6. PREPARE RDP LOGIN
      # ============================================================
      - name: Prepare Automatic RDP Login
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          cmdkey `
            /generic:TERMSRV/127.0.0.1 `
            /user:runneradmin `
            /pass:WindowsRDP#2025

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to store RDP credentials."
          }

          cmdkey `
            /generic:TERMSRV/localhost `
            /user:runneradmin `
            /pass:WindowsRDP#2025

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to store localhost RDP credentials."
          }

      # ============================================================
      # 7. START RDP - NO FIXED RESOLUTION
      # ============================================================
      - name: Start Automatic RDP Session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $regPath = "HKCU:\Software\Microsoft\Terminal Server Client"

          if (!(Test-Path $regPath)) {
              New-Item `
                -Path $regPath `
                -Force |
                Out-Null
          }

          Set-ItemProperty `
            -Path $regPath `
            -Name "AuthenticationLevelOverride" `
            -Value 0 `
            -Type DWord `
            -Force

          $mstsc = "$env:SystemRoot\System32\mstsc.exe"

          if (-not (Test-Path $mstsc)) {
              throw "mstsc.exe not found."
          }

          $process = Start-Process `
            -FilePath $mstsc `
            -ArgumentList "/v:127.0.0.1 /f" `
            -PassThru

          Write-Host "RDP client started."
          Write-Host "PID: $($process.Id)"

          Write-Host "Waiting 100 seconds for RDP desktop..."

          Start-Sleep -Seconds 100

          Write-Host ""
          Write-Host "Current sessions:"
          quser

      # ============================================================
      # 8. LAUNCH CHROME
      # ============================================================
      - name: Launch Chrome In RDP Session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Current sessions:"
          quser

          & schtasks.exe `
            /run `
            /tn "OpenChromeAutomatically"

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              throw "Could not start Chrome scheduled task."
          }

          Write-Host "Chrome scheduled task started."

      # ============================================================
      # 9. WAIT FOR CHROME
      # ============================================================
      - name: Wait For Chrome
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $found = $false

          for ($i = 1; $i -le 60; $i++) {

              $chrome = Get-Process `
                -Name "chrome" `
                -ErrorAction SilentlyContinue

              if ($chrome) {
                  Write-Host "Chrome process detected."
                  $found = $true
                  break
              }

              Write-Host "Chrome not detected yet: $i / 60"

              Start-Sleep -Seconds 2
          }

          if (-not $found) {
              throw "Chrome was not detected after 120 seconds."
          }

      # ============================================================
      # 10. WAIT FOR WEBSITE
      # ============================================================
      - name: Wait 100 Seconds For Website
        shell: powershell
        run: |
          Write-Host "Waiting 100 seconds for Chrome and website..."

          Start-Sleep -Seconds 100

      # ============================================================
      # 11. INSTALL FFMPEG
      # ============================================================
      - name: Install FFmpeg
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ffmpegDir = "C:\ffmpeg"
          $zipPath = "$env:TEMP\ffmpeg.zip"

          $downloadUrl = `
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"

          if (-not (Test-Path "$ffmpegDir\bin\ffmpeg.exe")) {

              Invoke-WebRequest `
                -Uri $downloadUrl `
                -OutFile $zipPath

              $extractDir = "$env:TEMP\ffmpeg_extract"

              if (Test-Path $extractDir) {
                  Remove-Item `
                    $extractDir `
                    -Recurse `
                    -Force
              }

              Expand-Archive `
                -Path $zipPath `
                -DestinationPath $extractDir `
                -Force

              $ffmpegExe = Get-ChildItem `
                -Path $extractDir `
                -Filter "ffmpeg.exe" `
                -Recurse |
                Select-Object -First 1

              if (-not $ffmpegExe) {
                  throw "ffmpeg.exe was not found."
              }

              New-Item `
                -ItemType Directory `
                -Path "$ffmpegDir\bin" `
                -Force |
                Out-Null

              Copy-Item `
                -Path "$($ffmpegExe.Directory.FullName)\*" `
                -Destination "$ffmpegDir\bin" `
                -Recurse `
                -Force

              Remove-Item `
                $zipPath `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $extractDir `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }

          $ffmpeg = "$ffmpegDir\bin\ffmpeg.exe"

          if (-not (Test-Path $ffmpeg)) {
              throw "FFmpeg installation failed."
          }

          & $ffmpeg -version |
            Select-Object -First 1

      # ============================================================
      # 12. CREATE CLICK + RECORD SCRIPT
      # ============================================================
      - name: Create Click And Record Script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = "C:\temp\ClickAndRecord.ps1"

          $script = @'
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class MouseAPI
          {
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(int X, int Y);

              [DllImport("user32.dll")]
              public static extern void mouse_event(
                  uint dwFlags,
                  uint dx,
                  uint dy,
                  uint dwData,
                  UIntPtr dwExtraInfo
              );

              public const uint LEFTDOWN = 0x0002;
              public const uint LEFTUP   = 0x0004;
          }
          "@

          # ========================================================
          # SETTINGS
          # ========================================================

          $x = 84
          $y = 614

          $preSeconds  = 5
          $postSeconds = 10

          $ffmpeg = "C:\ffmpeg\bin\ffmpeg.exe"

          $videoOutput = "C:\temp\rdp-click-video.mp4"
          $screenshotOutput = "C:\temp\rdp-click-screenshot.png"

          Write-Host "============================================"
          Write-Host "CLICK + RECORD"
          Write-Host "============================================"

          Write-Host "Click X      : $x"
          Write-Host "Click Y      : $y"
          Write-Host "Before click : $preSeconds seconds"
          Write-Host "After click  : $postSeconds seconds"
          Write-Host "Total video  : 15 seconds"
          Write-Host "Resolution   : NOT FORCED"
          Write-Host ""

          # ========================================================
          # ACTUAL DESKTOP SIZE
          # ========================================================

          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen

          Write-Host "Actual Desktop:"
          Write-Host "Left   : $($screen.Left)"
          Write-Host "Top    : $($screen.Top)"
          Write-Host "Width  : $($screen.Width)"
          Write-Host "Height : $($screen.Height)"
          Write-Host ""

          # ========================================================
          # VERY SMALL RED DOT
          # ========================================================

          $form = New-Object System.Windows.Forms.Form

          $form.FormBorderStyle = "None"
          $form.StartPosition = "Manual"
          $form.ShowInTaskbar = $false
          $form.TopMost = $true

          $form.BackColor = [System.Drawing.Color]::Red

          $form.Width = 10
          $form.Height = 10

          $form.Left = $x - 5
          $form.Top = $y - 5

          $form.Show()
          $form.Refresh()

          # ========================================================
          # START FFmpeg
          # ========================================================

          Write-Host "Starting FFmpeg..."

          $arguments = @(
              "-y"
              "-f"
              "gdigrab"
              "-framerate"
              "10"
              "-draw_mouse"
              "1"
              "-i"
              "desktop"
              "-t"
              "15"
              "-c:v"
              "libx264"
              "-preset"
              "ultrafast"
              "-pix_fmt"
              "yuv420p"
              "-movflags"
              "+faststart"
              $videoOutput
          )

          $ffmpegProcess = Start-Process `
            -FilePath $ffmpeg `
            -ArgumentList $arguments `
            -PassThru `
            -NoNewWindow

          Write-Host "FFmpeg PID: $($ffmpegProcess.Id)"

          # ========================================================
          # 5 SECONDS BEFORE CLICK
          # ========================================================

          Write-Host "Recording 5 seconds before click..."

          Start-Sleep -Seconds 5

          # ========================================================
          # MOVE MOUSE
          # ========================================================

          Write-Host "Moving mouse to X=$x Y=$y"

          [MouseAPI]::SetCursorPos($x, $y)

          Start-Sleep -Milliseconds 300

          # ========================================================
          # REAL CLICK
          # ========================================================

          Write-Host "CLICKING X=$x Y=$y"

          [MouseAPI]::mouse_event(
              [MouseAPI]::LEFTDOWN,
              0,
              0,
              0,
              [UIntPtr]::Zero
          )

          Start-Sleep -Milliseconds 100

          [MouseAPI]::mouse_event(
              [MouseAPI]::LEFTUP,
              0,
              0,
              0,
              [UIntPtr]::Zero
          )

          Write-Host "CLICK COMPLETED."

          # ========================================================
          # SCREENSHOT AFTER CLICK
          # ========================================================

          Start-Sleep -Milliseconds 500

          Write-Host "Taking screenshot..."

          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen

          $bitmap = New-Object `
            System.Drawing.Bitmap `
            $screen.Width, `
            $screen.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
              $screen.Left,
              $screen.Top,
              0,
              0,
              $screen.Size
          )

          $bitmap.Save(
              $screenshotOutput,
              [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Screenshot created:"
          Write-Host $screenshotOutput

          # ========================================================
          # 10 SECONDS AFTER CLICK
          # ========================================================

          Write-Host "Recording 10 seconds after click..."

          Start-Sleep -Seconds 10

          # ========================================================
          # WAIT FOR FFMPEG
          # ========================================================

          Write-Host "Waiting for FFmpeg..."

          $ffmpegProcess.WaitForExit()

          if ($ffmpegProcess.ExitCode -ne 0) {
              throw "FFmpeg failed. Exit code: $($ffmpegProcess.ExitCode)"
          }

          # ========================================================
          # CLOSE RED DOT
          # ========================================================

          $form.Close()
          $form.Dispose()

          Write-Host ""
          Write-Host "============================================"
          Write-Host "CLICK + RECORD COMPLETED"
          Write-Host "============================================"

          if (-not (Test-Path $videoOutput)) {
              throw "Video file was not created."
          }

          if (-not (Test-Path $screenshotOutput)) {
              throw "Screenshot file was not created."
          }

          Write-Host "Video:"
          Write-Host $videoOutput

          Write-Host "Screenshot:"
          Write-Host $screenshotOutput

          Write-Host "Video size:"
          Write-Host (Get-Item $videoOutput).Length

          Write-Host "Screenshot size:"
          Write-Host (Get-Item $screenshotOutput).Length

          '@

          Set-Content `
            -Path $scriptPath `
            -Value $script `
            -Encoding UTF8

          Write-Host "Click recording script created."

      # ============================================================
      # 13. CREATE RECORDING SCHEDULED TASK
      # ============================================================
      - name: Create Recording Scheduled Task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $taskName = "RDPClickAndRecord"

          cmd.exe /c "schtasks /query /tn `"$taskName`" >nul 2>&1"

          if ($LASTEXITCODE -eq 0) {

              cmd.exe /c "schtasks /delete /tn `"$taskName`" /f >nul 2>&1"

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to delete old recording task."
              }
          }

          $createArguments = @(
              "/create"
              "/tn"
              $taskName
              "/tr"
              'powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\temp\ClickAndRecord.ps1'
              "/sc"
              "ONCE"
              "/st"
              "00:00"
              "/sd"
              "01/01/2030"
              "/ru"
              "runneradmin"
              "/rp"
              "WindowsRDP#2025"
              "/it"
              "/f"
          )

          & schtasks.exe @createArguments

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create recording task."
          }

      # ============================================================
      # 14. START CLICK + RECORDING
      # ============================================================
      - name: Start Click And Recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "STARTING CLICK + RECORDING"
          Write-Host "============================================"

          & schtasks.exe `
            /run `
            /tn "RDPClickAndRecord"

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              throw "Could not start recording task. Exit code: $exitCode"
          }

          Write-Host ""
          Write-Host "Recording started."
          Write-Host "0s  = recording starts"
          Write-Host "5s  = click X=84 Y=614"
          Write-Host "5.5s = screenshot"
          Write-Host "15s = recording ends"

      # ============================================================
      # 15. WAIT FOR RECORDING
      # ============================================================
      - name: Wait For Recording Completion
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $video = "C:\temp\rdp-click-video.mp4"
          $screenshot = "C:\temp\rdp-click-screenshot.png"

          $finished = $false

          for ($i = 1; $i -le 60; $i++) {

              $videoExists = Test-Path $video
              $screenshotExists = Test-Path $screenshot

              if ($videoExists -and $screenshotExists) {

                  $size = (Get-Item $video).Length

                  if ($size -gt 10000) {
                      $finished = $true
                      break
                  }
              }

              Write-Host "Waiting... $i / 60"

              Start-Sleep -Seconds 1
          }

          if (-not $finished) {
              throw "Recording did not finish within expected time."
          }

          Write-Host "Recording completed."

      # ============================================================
      # 16. COPY FILES
      # ============================================================
      - name: Copy Recording Files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Copy-Item `
            "C:\temp\rdp-click-video.mp4" `
            "$env:GITHUB_WORKSPACE\rdp-click-video.mp4" `
            -Force

          Copy-Item `
            "C:\temp\rdp-click-screenshot.png" `
            "$env:GITHUB_WORKSPACE\rdp-click-screenshot.png" `
            -Force

          Write-Host "Files copied."

      # ============================================================
      # 17. UPLOAD SCREENSHOT
      # ============================================================
      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-screenshot
          path: ${{ github.workspace }}/rdp-click-screenshot.png
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 18. UPLOAD VIDEO
      # ============================================================
      - name: Upload Click Recording Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-click-video
          path: ${{ github.workspace }}/rdp-click-video.mp4
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 19. FINAL INFORMATION
      # ============================================================
      - name: Display Final Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "              RDP JOB COMPLETED"
          Write-Host "================================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USER"
          Write-Host ""
          Write-Host "Resolution   : NOT FORCED"
          Write-Host "RDP Mode     : FULL SCREEN"
          Write-Host ""
          Write-Host "Click X      : 84"
          Write-Host "Click Y      : 614"
          Write-Host ""
          Write-Host "Before click : 5 seconds"
          Write-Host "After click  : 10 seconds"
          Write-Host "Total video  : ~15 seconds"
          Write-Host ""
          Write-Host "Red dot      : 10x10 pixels"
          Write-Host ""
          Write-Host "Screenshot   : rdp-click-screenshot.png"
          Write-Host "Video        : rdp-click-video.mp4"
          Write-Host ""
          Write-Host "Artifacts:"
          Write-Host "  rdp-click-screenshot"
          Write-Host "  rdp-click-video"
          Write-Host ""
          Write-Host "No Keep Alive."
          Write-Host ""
          Write-Host "================================================"
